<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>جزئیات محصول | Mobile Iran</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --dark-color: #1d1d1f; 
            --gray-bg: #f5f5f7; 
            --border-color: #e5e5ea; 
            --text-color: #1d1d1f; 
            --text-light: #86868b; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #fff; color: var(--text-color); line-height: 1.6; overflow-x: hidden; }
        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }

        header { background-color: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 1000; }
        .header-container { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0.8rem 1rem; }
        .logo { font-size: 1.2rem; font-weight: 800; color: var(--dark-color); }
        
        .nav-links { display: none; }
        .header-actions { display: flex; align-items: center; gap: 0.6rem; }
        .btn-action { background: var(--gray-bg); border: 1px solid var(--border-color); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; color: var(--dark-color); }
        
        .detail-container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; display: grid; gap: 2rem; grid-template-columns: 1fr; }
        
        .product-image-box { background: #fff; border: 1px solid var(--border-color); border-radius: 16px; padding: 2rem; display: flex; align-items: center; justify-content: center; min-height: 300px; }
        .product-image-box img { max-width: 100%; max-height: 350px; object-fit: contain; }
        
        .product-info-box { display: flex; flex-direction: column; justify-content: center; }
        .product-category { color: var(--text-light); font-size: 0.85rem; margin-bottom: 0.5rem; font-weight: 600; }
        .product-title { font-size: 1.6rem; font-weight: 800; color: var(--dark-color); margin-bottom: 1rem; line-height: 1.3; }
        .product-price { font-size: 1.4rem; font-weight: 700; color: var(--dark-color); margin-bottom: 1.5rem; }
        
        .product-description { font-size: 0.95rem; color: var(--text-light); margin-bottom: 2rem; line-height: 1.8; }
        
        .btn-add-cart { background: var(--dark-color); color: #fff; width: 100%; border: none; padding: 1rem; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; transition: background 0.2s; }
        .btn-add-cart:hover { background: #000; }
        .btn-add-cart:active { transform: scale(0.98); }

        #error-msg { text-align: center; margin-top: 3rem; color: red; font-weight: bold; display: none; }

        footer { background-color: var(--gray-bg); border-top: 1px solid var(--border-color); padding: 2rem 1rem; text-align: center; color: var(--text-light); font-size: 0.8rem; margin-top: 4rem; }

        @media (min-width: 768px) {
            .header-container { padding: 1rem 2rem; }
            .nav-links { display: flex; gap: 1.5rem; align-items: center; }
            .nav-links a { font-size: 0.9rem; color: var(--text-light); }
            .nav-links a:hover { color: var(--dark-color); font-weight: 600; }
            .detail-container { grid-template-columns: 1fr 1fr; align-items: start; margin-top: 4rem; }
            .product-title { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo">Mobile Iran</div>
            <ul class="nav-links">
                <li><a href="index.html">خانه</a></li>
                <li><a href="products.html">محصولات</a></li>
                <li><a href="about.html">درباره ما</a></li>
            </ul>
            <div class="header-actions">
                <a href="cart.html" class="btn-action"><i class="fa-solid fa-bag-shopping"></i></a>
                <a href="auth.html" class="btn-action"><i class="fa-regular fa-user"></i></a>
            </div>
        </div>
    </header>

    <div id="error-msg">محصول مورد نظر یافت نشد. <br><br> <a href="products.html" style="color:var(--dark-color); text-decoration:underline;">بازگشت به محصولات</a></div>

    <section class="detail-container" id="product-content" style="display: none;">
        <div class="product-image-box">
            <img id="detail-image" src="" alt="عکس محصول">
        </div>
        <div class="product-info-box">
            <div class="product-category" id="detail-category"></div>
            <h1 class="product-title" id="detail-title"></h1>
            <div class="product-price"><span id="detail-price"></span> تومان</div>
            <p class="product-description" id="detail-desc"></p>
            
            <button class="btn-add-cart" onclick="addToCart()">
                <i class="fa-solid fa-cart-plus"></i> افزودن به سبد خرید
            </button>
        </div>
    </section>

    <footer><p>تمامی حقوق محفوظ است | <strong>Mobile Iran</strong></p></footer>

    <script>
        const productsData = [
            { id: 1, name: "قاب سیلیکونی اصل آیفون", category: "قاب‌ها (Cases)", price: "۳۵۰,۰۰۰", desc: "قاب سیلیکونی اورجینال با پوشش نرم داخلی برای محافظت کامل از گوشی شما در برابر ضربه و خط و خش. طراحی ظریف و زیبا و رنگ‌بندی متنوع.", image: "https://ik.imagekit.io/MRrobat/Mobile%20iran/Generic%20Silicone%20Case%20for%20iPhone%2017%20Pro%20Max%20_%20Soft-Touch%20Shockproof%20Slim%20Protective%20Cover%20with%20Soft%20Inner%20Lining,%20Camera%20Protection%20&%20Anti-Slip%20Grip%20-%20Orange%20_%20Best%20Price%20Egypt%20_%20Cairo,%20Giza.jpg" },
            { id: 2, name: "پاوربانک مگ‌سیف ۲۰ وات", category: "مگ‌سیف (MagSafe)", price: "۱,۲۵۰,۰۰۰", desc: "پاوربانک بی‌سیم مگ‌سیف با ظرفیت ۵۰۰۰ میلی‌آمپر و پشتیبانی از شارژ سریع ۲۰ وات، اتصال مغناطیسی قدرتمند مناسب برای خانواده آیفون ۱۲ به بعد.", image: "https://ik.imagekit.io/MRrobat/Mobile%20iran/Apple%20Magsafe%20Wireless%20Power%20Bank%20For%20Iphone%205000mah%2020w%20Fast%20Charging.jpg" },
            { id: 3, name: "کابل تایپ سی به لایتنینگ", category: "کابل و مبدل (Cables)", price: "۲۸۰,۰۰۰", desc: "کابل شارژ سریع با روکش مقاوم در برابر گره خوردگی و کشیدگی، پشتیبانی از انتقال دیتای پرسرعت و فست شارژ برای تمامی دستگاه‌های اپل.", image: "https://ik.imagekit.io/MRrobat/Mobile%20iran/download%20(13).jpg" },
            { id: 4, name: "شارژر دیواری سریع ۲۰ وات", category: "شارژر وایرلس (Charger)", price: "۴۹۰,۰۰۰", desc: "آداپتور ۲۰ وات اورجینال با پورت Type-C، دارای فناوری شارژ هوشمند و ایمن بدون آسیب رساندن به سلامت باتری گوشی شما.", image: "https://ik.imagekit.io/MRrobat/Mobile%20iran/download%20(15).jpg" },
            { id: 5, name: "پاوربانک ۳۵ وات مسافرتی", category: "پاوربانک (Power Banks)", price: "۱,۸۹۰,۰۰۰", desc: "پاوربانک قدرتمند با توان ۳۵ وات، مناسب برای شارژ همزمان چندین دستگاه در سفرهای طولانی با ظرفیت فوق‌العاده بالا و طراحی جمع‌وجور.", image: "https://ik.imagekit.io/MRrobat/Mobile%20iran/Don't%20Board%20Your%20Next%20Flight%20Without%20This%2035W%20Fast%20Charging%20Power%20Bank.jpg" }
        ];

        let currentProduct = null;

        // گرفتن آیدی از آدرس صفحه
        const urlParams = new URLSearchParams(window.location.search);
        const productId = parseInt(urlParams.get('id'));

        if (productId) {
            currentProduct = productsData.find(p => p.id === productId);
            if (currentProduct) {
                document.getElementById('product-content').style.display = 'grid';
                document.getElementById('detail-image').src = currentProduct.image;
                document.getElementById('detail-title').innerText = currentProduct.name;
                document.getElementById('detail-category').innerText = currentProduct.category;
                document.getElementById('detail-price').innerText = currentProduct.price;
                document.getElementById('detail-desc').innerText = currentProduct.desc;
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        } else {
            document.getElementById('error-msg').style.display = 'block';
        }

        // تابع افزودن به سبد خرید
        function addToCart() {
            if (!currentProduct) return;
            
            // گرفتن سبد خرید فعلی از حافظه مرورگر
            let cart = JSON.parse(localStorage.getItem('mobileIranCart')) || [];
            
            // بررسی اینکه محصول قبلا اضافه شده یا نه
            const existingItem = cart.find(item => item.id === currentProduct.id);
            if (existingItem) {
                existingItem.qty += 1;
            } else {
                cart.push({ ...currentProduct, qty: 1 });
            }
            
            // ذخیره مجدد در حافظه
            localStorage.setItem('mobileIranCart', JSON.stringify(cart));
            
            alert('محصول با موفقیت به سبد خرید اضافه شد!');
            window.location.href = 'cart.html'; // هدایت مستقیم به صفحه سبد خرید
        }
    </script>
</body>
</html>
