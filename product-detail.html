<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>جزئیات محصول | Mobile Iran</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --dark-color: #1d1d1f; 
            --gray-bg: #f5f5f7; 
            --border-color: #e5e5ea; 
            --text-color: #1d1d1f; 
            --text-light: #86868b; 
            --accent-color: #007aff;
            --success: #34c759;
            --star-color: #ff9500;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--gray-bg); color: var(--text-color); line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }
        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }

        /* هدر */
        header { background-color: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 1000; }
        .header-container { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0.8rem 1rem; }
        .logo { font-size: 1.2rem; font-weight: 800; color: var(--dark-color); }
        .nav-links { display: flex; gap: 1.5rem; align-items: center; }
        .nav-links a { font-size: 0.9rem; color: var(--text-light); transition: 0.2s; }
        .nav-links a:hover, .nav-links a.active { color: var(--dark-color); font-weight: 600; }
        .header-actions { display: flex; align-items: center; gap: 0.6rem; }
        .btn-action { background: var(--gray-bg); border: 1px solid var(--border-color); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; color: var(--dark-color); }

        /* بخش اصلی محصول */
        main { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; width: 100%; flex: 1; }
        
        .product-detail-card { background: #fff; border-radius: 20px; border: 1px solid var(--border-color); padding: 2rem; display: grid; grid-template-columns: 1fr 1fr; gap: 2.5rem; margin-bottom: 3rem; box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
        
        .product-gallery { display: flex; flex-direction: column; gap: 1rem; align-items: center; }
        .main-image-box { width: 100%; height: 350px; background: var(--gray-bg); border-radius: 14px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid var(--border-color); }
        .main-image-box img { max-width: 80%; max-height: 80%; object-fit: contain; }

        .product-info-side { display: flex; flex-direction: column; gap: 1rem; }
        .product-category-tag { font-size: 0.8rem; font-weight: 600; color: var(--accent-color); background: #e3f2fd; padding: 0.2rem 0.6rem; border-radius: 6px; width: fit-content; }
        .product-title { font-size: 1.6rem; font-weight: 800; color: var(--dark-color); }
        .product-rating { display: flex; align-items: center; gap: 0.4rem; color: var(--star-color); font-size: 0.9rem; }
        .product-rating span { color: var(--text-light); font-size: 0.85rem; margin-right: 0.3rem; }
        
        .product-price-box { display: flex; align-items: center; gap: 1rem; margin: 0.5rem 0; }
        .current-price { font-size: 1.4rem; font-weight: 800; color: var(--dark-color); }
        .old-price { font-size: 1rem; color: var(--text-light); text-decoration: line-through; }
        
        .product-description { font-size: 0.95rem; color: var(--text-light); line-height: 1.8; border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); padding: 1rem 0; }
        
        .btn-add-to-cart { background: var(--accent-color); color: #fff; border: none; width: 100%; padding: 1rem; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-top: auto; }
        .btn-add-to-cart:hover { background: #005bb5; }

        /* بخش نظرات کاربران */
        .section-title { font-size: 1.3rem; font-weight: 800; color: var(--dark-color); margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; }
        .reviews-container { background: #fff; border-radius: 20px; border: 1px solid var(--border-color); padding: 2rem; margin-bottom: 3rem; }
        
        .review-item { padding: 1rem 0; border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 0.4rem; }
        .review-item:last-child { border-bottom: none; }
        .review-header { display: flex; justify-content: space-between; align-items: center; }
        .reviewer-name { font-weight: 700; font-size: 0.95rem; }
        .review-date { font-size: 0.75rem; color: var(--text-light); }
        .review-text { font-size: 0.9rem; color: var(--text-color); }

        .add-review-form { margin-top: 2rem; border-top: 1px solid var(--border-color); padding-top: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .form-control { width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border-color); border-radius: 10px; font-family: inherit; font-size: 0.9rem; outline: none; background: var(--gray-bg); }
        .form-control:focus { border-color: var(--accent-color); background: #fff; }
        textarea.form-control { resize: vertical; min-height: 100px; }
        .btn-submit-review { background: var(--dark-color); color: #fff; border: none; padding: 0.8rem 1.5rem; border-radius: 10px; font-weight: 700; cursor: pointer; width: fit-content; }

        /* محصولات مشابه */
        .similar-products-section { margin-bottom: 3rem; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.5rem; }
        .product-card { background: #fff; border-radius: 16px; border: 1px solid var(--border-color); padding: 1.2rem; display: flex; flex-direction: column; gap: 0.8rem; transition: 0.2s; }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .card-img { width: 100%; height: 160px; background: var(--gray-bg); border-radius: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .card-img img { max-width: 80%; max-height: 80%; object-fit: contain; }
        .card-title { font-size: 0.95rem; font-weight: 700; color: var(--dark-color); }
        .card-price { font-size: 0.9rem; font-weight: 800; color: var(--accent-color); }

        footer { background-color: var(--gray-bg); border-top: 1px solid var(--border-color); padding: 2rem 1rem; text-align: center; color: var(--text-light); font-size: 0.8rem; }

        @media (max-width: 768px) {
            .product-detail-card { grid-template-columns: 1fr; padding: 1.2rem; }
            .form-row { grid-template-columns: 1fr; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo">Mobile Iran</div>
            <ul class="nav-links">
                <li><a href="index.html">خانه</a></li>
                <li><a href="products.html" class="active">محصولات</a></li>
                <li><a href="about.html">درباره ما</a></li>
            </ul>
            <div class="header-actions">
                <a href="cart.html" class="btn-action"><i class="fa-solid fa-bag-shopping"></i></a>
                <a href="auth.html" class="btn-action"><i class="fa-solid fa-user"></i></a>
            </div>
        </div>
    </header>

    <main>
        <!-- اطلاعات اصلی محصول -->
        <div class="product-detail-card" id="product-detail-container">
            <!-- محتوا توسط جاوااسکریپت لود می‌شود -->
        </div>

        <!-- نظرات کاربران -->
        <div class="reviews-container">
            <div class="section-title"><i class="fa-regular fa-comments"></i> نظرات کاربران</div>
            
            <div id="reviews-list">
                <!-- لیست نظرات -->
                <div class="review-item">
                    <div class="review-header">
                        <span class="reviewer-name">محمد رضایی</span>
                        <span class="review-date">۱۴۰۲/۰۸/۱۵</span>
                    </div>
                    <div class="review-rating" style="font-size: 0.8rem;">
                        <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i>
                    </div>
                    <p class="review-text">محصول بسیار باکیفیتیه، دقیقاً همونی بود که توی سایت دیدم. ممنون از ارسال سریعتون.</p>
                </div>
            </div>

            <!-- فرم ثبت نظر جدید -->
            <form class="add-review-form" onsubmit="submitReview(event)">
                <h4 style="font-size: 1rem; font-weight: 700;">شما هم درباره این محصول نظر بدهید</h4>
                <div class="form-row">
                    <input type="text" id="review-name" class="form-control" placeholder="نام شما" required>
                    <select id="review-rating-select" class="form-control">
                        <option value="5">⭐⭐⭐⭐⭐ (عالی)</option>
                        <option value="4">⭐⭐⭐⭐ (خوب)</option>
                        <option value="3">⭐⭐⭐ (متوسط)</option>
                        <option value="2">⭐⭐ (ضعیف)</option>
                        <option value="1">⭐ (خیلی بد)</option>
                    </select>
                </div>
                <textarea id="review-text" class="form-control" placeholder="متن نظر شما..." required></textarea>
                <button type="submit" class="btn-submit-review">ارسال نظر</button>
            </form>
        </div>

        <!-- محصولات مشابه -->
        <div class="similar-products-section">
            <div class="section-title"><i class="fa-solid fa-layer-group"></i> محصولات مشابه</div>
            <div class="products-grid" id="similar-products-grid">
                <!-- محصولات مشابه با جاوااسکریپت لود می‌شوند -->
            </div>
        </div>
    </main>

    <footer><p>تمامی حقوق محفوظ است | <strong>Mobile Iran</strong></p></footer>

  <script>
        const API_BASE = "https://mobile-iran-api.mahdih1479mm.workers.dev";
        const urlParams = new URLSearchParams(window.location.search);
        const productId = parseInt(urlParams.get('id'));

        let currentProduct = null;
        let allProducts = [];

        async function loadProductData() {
            try {
                const res = await fetch(`${API_BASE}/api/products`);
                allProducts = await res.json();
                currentProduct = allProducts.find(p => p.id === productId);
                
                if (currentProduct) {
                    renderProductDetail();
                    renderSimilarProducts();
                } else {
                    document.getElementById('product-detail-container').innerHTML = '<p>محصول یافت نشد.</p>';
                }
            } catch (err) {
                console.error(err);
            }
        }

        function renderProductDetail() {
            const container = document.getElementById('product-detail-container');
            let priceHtml = currentProduct.discount_price 
                ? `<div class="product-price-box"><span class="current-price" style="color:var(--danger);">${currentProduct.discount_price} تومان</span><span class="old-price">${currentProduct.price} تومان</span></div>`
                : `<div class="product-price-box"><span class="current-price">${currentProduct.price} تومان</span></div>`;

            container.innerHTML = `
                <div class="product-gallery">
                    <div class="main-image-box">
                        <img src="${currentProduct.image}" alt="${currentProduct.name}">
                    </div>
                </div>
                <div class="product-info-side">
                    <span class="product-category-tag">${currentProduct.category}</span>
                    <h1 class="product-title">${currentProduct.name}</h1>
                    <div class="product-rating">
                        <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star-half-stroke"></i>
                        <span>(۴.۸ از ۵)</span>
                    </div>
                    ${priceHtml}
                    <p class="product-description">${currentProduct.description || 'توضیحات تکمیلی برای این محصول ثبت نشده است.'}</p>
                    <button class="btn-add-to-cart" onclick="addToCart(${currentProduct.id})">
                        <i class="fa-solid fa-bag-shopping"></i> افزودن به سبد خرید
                    </button>
                </div>
            `;
        }

        function renderSimilarProducts() {
            const grid = document.getElementById('similar-products-grid');
            grid.innerHTML = '';
            const similar = allProducts.filter(p => p.category === currentProduct.category && p.id !== currentProduct.id);
            const displayList = similar.length > 0 ? similar : allProducts.filter(p => p.id !== currentProduct.id).slice(0, 4);

            if(displayList.length === 0) {
                grid.innerHTML = '<p style="color:var(--text-light); font-size:0.9rem;">محصول مشابهی یافت نشد.</p>';
                return;
            }

            displayList.forEach(p => {
                let pPrice = p.discount_price ? p.discount_price : p.price;
                grid.innerHTML += `
                    <a href="product-detail.html?id=${p.id}" class="product-card">
                        <div class="card-img"><img src="${p.image}" alt="${p.name}"></div>
                        <h4 class="card-title">${p.name}</h4>
                        <div class="card-price">${pPrice} تومان</div>
                    </a>
                `;
            });
        }

        function addToCart(id) {
            let cart = JSON.parse(localStorage.getItem('mobileIranCart')) || [];
            let existingItem = cart.find(item => item.id === id);
            if (existingItem) {
                existingItem.qty = (existingItem.qty || 1) + 1;
            } else {
                cart.push({ ...currentProduct, qty: 1 });
            }
            localStorage.setItem('mobileIranCart', JSON.stringify(cart));
            alert('محصول به سبد خرید اضافه شد!');
        }

        // توابع submitReview ثابت می ماند ...

        window.onload = loadProductData;
    </script>
</body>
</html>
