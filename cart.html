<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سبد خرید | Mobile Iran</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --dark-color: #1d1d1f; 
            --gray-bg: #f5f5f7; 
            --border-color: #e5e5ea; 
            --text-color: #1d1d1f; 
            --text-light: #86868b; 
            --danger: #ff3b30;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #fff; color: var(--text-color); line-height: 1.6; overflow-x: hidden; }
        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }

        /* هدر */
        header { background-color: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 1000; }
        .header-container { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0.8rem 1rem; }
        .logo { font-size: 1.2rem; font-weight: 800; color: var(--dark-color); }
        .nav-links { display: none; }
        .header-actions { display: flex; align-items: center; gap: 0.6rem; }
        .btn-action { background: var(--gray-bg); border: 1px solid var(--border-color); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; color: var(--dark-color); }

        /* ساختار سبد خرید */
        .cart-wrapper { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; display: grid; gap: 2rem; grid-template-columns: 1fr; }
        .page-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 1.5rem; color: var(--dark-color); }

        .cart-items-container { display: flex; flex-direction: column; gap: 1rem; }
        .cart-item { display: flex; gap: 1rem; background: #fff; border: 1px solid var(--border-color); padding: 1rem; border-radius: 12px; align-items: center; position: relative; }
        .cart-item img { width: 80px; height: 80px; object-fit: contain; border-radius: 8px; background: var(--gray-bg); padding: 5px; }
        
        .item-info { flex: 1; }
        .item-info h3 { font-size: 0.9rem; font-weight: 700; color: var(--dark-color); margin-bottom: 0.3rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .item-price { font-size: 0.85rem; color: var(--text-light); font-weight: 600; margin-bottom: 0.5rem; }
        
        .qty-controls { display: flex; align-items: center; gap: 0.8rem; }
        .btn-qty { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--gray-bg); display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; color: var(--dark-color); transition: background 0.2s; }
        .btn-qty:active { transform: scale(0.95); background: var(--border-color); }
        .qty-number { font-weight: 700; font-size: 0.9rem; min-width: 20px; text-align: center; }

        .btn-remove { position: absolute; top: 1rem; left: 1rem; background: none; border: none; color: var(--danger); font-size: 1.1rem; cursor: pointer; }

        /* باکس خلاصه سفارش */
        .summary-box { background: var(--gray-bg); border: 1px solid var(--border-color); padding: 1.5rem; border-radius: 16px; height: fit-content; }
        .summary-box h3 { font-size: 1.1rem; font-weight: 800; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.8rem; }
        
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 1rem; font-size: 0.9rem; color: var(--text-color); }
        .summary-row.total { font-weight: 800; font-size: 1.1rem; border-top: 1px solid var(--border-color); padding-top: 1rem; margin-top: 1rem; color: var(--dark-color); }

        .btn-checkout { background: var(--dark-color); color: #fff; width: 100%; padding: 1rem; border: none; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 1.5rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .btn-checkout:active { transform: scale(0.98); }

        .empty-cart { text-align: center; padding: 3rem 1rem; color: var(--text-light); }
        .empty-cart i { font-size: 3rem; margin-bottom: 1rem; opacity: 0.5; }
        .btn-outline { display: inline-block; margin-top: 1.5rem; border: 2px solid var(--dark-color); color: var(--dark-color); padding: 0.7rem 1.5rem; border-radius: 25px; font-weight: 700; }

        footer { background-color: var(--gray-bg); border-top: 1px solid var(--border-color); padding: 2rem 1rem; text-align: center; color: var(--text-light); font-size: 0.8rem; margin-top: 4rem; }

        @media (min-width: 768px) {
            .header-container { padding: 1rem 2rem; }
            .nav-links { display: flex; gap: 1.5rem; align-items: center; }
            .nav-links a { font-size: 0.9rem; color: var(--text-light); }
            .nav-links a:hover, .nav-links a.active { color: var(--dark-color); font-weight: 600; }
            .cart-wrapper { grid-template-columns: 2fr 1fr; align-items: start; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo">Mobile Iran</div>
            <ul class="nav-links">
                <li><a href="index.html">خانه</a></li>
                <li><a href="products.html">محصولات</a></li>
                <li><a href="about.html">درباره ما</a></li>
            </ul>
            <div class="header-actions">
                <a href="cart.html" class="btn-action" style="color:var(--accent-color); border-color:var(--accent-color);"><i class="fa-solid fa-bag-shopping"></i></a>
                <a href="auth.html" class="btn-action"><i class="fa-regular fa-user"></i></a>
            </div>
        </div>
    </header>

    <div class="cart-wrapper" id="main-content">
        <!-- محتوای سبد خرید توسط جاوااسکریپت در اینجا تولید می‌شود -->
    </div>

    <footer><p>تمامی حقوق محفوظ است | <strong>Mobile Iran</strong></p></footer>

    <script>
        const SHIPPING_COST = 180000;
        let cart = JSON.parse(localStorage.getItem('mobileIranCart')) || [];

        // تابع تبدیل اعداد فارسی به انگلیسی برای محاسبه دقیق ریاضی قیمت‌ها
        function persianToEnglishNumber(str) {
            if (!str) return '0';
            const persian = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
            for (let i = 0; i < 10; i++) {
                str = str.replace(new RegExp(persian[i], 'g'), i);
            }
            return str;
        }

        // تابع فرمت کردن اعداد به شکل سه‌رقم سه‌رقم
        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        function renderCart() {
            const wrapper = document.getElementById('main-content');
            
            if (cart.length === 0) {
                wrapper.innerHTML = `
                    <div class="empty-cart" style="grid-column: 1/-1;">
                        <i class="fa-solid fa-cart-arrow-down"></i>
                        <h2>سبد خرید شما خالی است</h2>
                        <a href="products.html" class="btn-outline">مشاهده محصولات</a>
                    </div>
                `;
                return;
            }

            let itemsHtml = '<div class="cart-items-container"><h2 class="page-title">سبد خرید شما</h2>';
            
            cart.forEach((item, index) => {
                itemsHtml += `
                    <div class="cart-item">
                        <button class="btn-remove" onclick="removeItem(${index})"><i class="fa-solid fa-trash"></i></button>
                        <img src="${item.image}" alt="${item.name}">
                        <div class="item-info">
                            <h3>${item.name}</h3>
                            <div class="item-price">${item.price} تومان</div>
                            <div class="qty-controls">
                                <button class="btn-qty" onclick="changeQty(${index}, 1)"><i class="fa-solid fa-plus"></i></button>
                                <span class="qty-number">${item.qty}</span>
                                <button class="btn-qty" onclick="changeQty(${index}, -1)"><i class="fa-solid fa-minus"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            });
            itemsHtml += '</div>';

            const summaryHtml = `
                <div class="summary-box">
                    <h3>خلاصه سفارش</h3>
                    <div class="summary-row"><span>جمع محصولات:</span> <span id="itemsTotalText"></span></div>
                    <div class="summary-row"><span>هزینه ارسال:</span> <span id="shippingText">${formatNumber(SHIPPING_COST)} تومان</span></div>
                    <div class="summary-row total"><span>مبلغ قابل پرداخت:</span> <span id="finalTotalText"></span></div>
                    <button class="btn-checkout" onclick="alert('انتقال به درگاه پرداخت...')">
                        <i class="fa-solid fa-credit-card"></i> ثبت و پرداخت
                    </button>
                </div>
            `;

            wrapper.innerHTML = itemsHtml + summaryHtml;
            calculateCartTotals();
        }

        function calculateCartTotals() {
            let itemsTotal = 0;
            
            cart.forEach(item => {
                // تبدیل عدد فارسی به انگلیسی، سپس حذف کاماها و استخراج عدد
                let englishString = persianToEnglishNumber(item.price.toString());
                let cleanPrice = parseInt(englishString.replace(/[^0-9]/g, '')) || 0;
                itemsTotal += cleanPrice * item.qty;
            });

            let finalTotal = itemsTotal + SHIPPING_COST;

            document.getElementById('itemsTotalText').innerText = formatNumber(itemsTotal) + ' تومان';
            document.getElementById('finalTotalText').innerText = formatNumber(finalTotal) + ' تومان';
        }

        function changeQty(index, amount) {
            cart[index].qty += amount;
            if (cart[index].qty < 1) {
                cart.splice(index, 1);
            }
            saveAndRender();
        }

        function removeItem(index) {
            cart.splice(index, 1);
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('mobileIranCart', JSON.stringify(cart));
            renderCart();
        }

        window.addEventListener('DOMContentLoaded', renderCart);
    </script>
</body>
</html>
