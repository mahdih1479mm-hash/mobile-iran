<script>
        const API_URL = 'https://mobile-iran-api.mahdih1479mm.workers.dev';

        // تابع جابجایی بین تب ورود و ثبت‌نام
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));
            
            if (tabId === 'login') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('login-form').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('register-form').classList.add('active');
            }
        }

        // تابع مدیریت ارسال فرم‌ها به سرور ابری
        async function handleAuth(event, type) {
            event.preventDefault();

            const form = event.target;
            const inputs = form.querySelectorAll('input');
            
            let data = {};
            if (type === 'login') {
                data = {
                    phone: inputs[0].value.trim(),
                    password: inputs[1].value
                };
            } else if (type === 'register') {
                data = {
                    name: inputs[0].value.trim(),
                    phone: inputs[1].value.trim(),
                    password: inputs[2].value
                };
            }

            const endpoint = type === 'login' ? `${API_URL}/api/login` : `${API_URL}/api/register`;

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    alert(result.message || (type === 'login' ? 'ورود با موفقیت انجام شد!' : 'ثبت‌نام با موفقیت انجام شد!'));
                    
                    // ذخیره توکن یا مشخصات کاربر در لوکال استوریج
                    localStorage.setItem('userIsLoggedIn', 'true');
                    if (result.token) {
                        localStorage.setItem('userToken', result.token);
                    }
                    if (result.user) {
                        localStorage.setItem('userData', JSON.stringify(result.user));
                    }
                    
                    window.location.href = 'index.html';
                } else {
                    alert(result.error || 'خطایی رخ داد. لطفا دوباره تلاش کنید.');
                }
            } catch (error) {
                console.error('Network Error:', error);
                alert('خطا در ارتباط با سرور ابری. اتصال اینترنت خود را بررسی کنید.');
            }
        }
    </script>
