<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود / ثبت‌نام | Mobile Iran</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --dark-color: #1d1d1f; --gray-bg: #f5f5f7; --border-color: #e5e5ea; --text-light: #86868b; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
        body { background-color: var(--gray-bg); color: var(--dark-color); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; }
        .auth-container { width: 100%; max-width: 400px; background: #fff; padding: 2rem; border-radius: 16px; border: 1px solid var(--border-color); box-shadow: 0 4px 16px rgba(0,0,0,0.04); }
        .auth-header { text-align: center; margin-bottom: 1.5rem; }
        .auth-header h1 { font-size: 1.4rem; font-weight: 800; margin-bottom: 0.3rem; }
        .auth-header p { font-size: 0.85rem; color: var(--text-light); }
        
        .tabs { display: flex; border: 1px solid var(--border-color); border-radius: 10px; margin-bottom: 1.5rem; overflow: hidden; background: var(--gray-bg); }
        .tab { flex: 1; padding: 0.6rem; text-align: center; font-size: 0.85rem; font-weight: 600; cursor: pointer; color: var(--text-light); border: none; background: transparent; transition: all 0.2s; }
        .tab.active { background: #fff; color: var(--dark-color); box-shadow: 0 2px 6px rgba(0,0,0,0.03); }

        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.8rem; margin-bottom: 0.3rem; font-weight: 600; }
        .form-group input { width: 100%; padding: 0.7rem 1rem; border: 1px solid var(--border-color); border-radius: 10px; font-size: 0.9rem; outline: none; }
        .form-group input:focus { border-color: var(--dark-color); }
        
        .btn-submit { background: var(--dark-color); color: #fff; border: none; padding: 0.8rem; border-radius: 10px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 1rem; font-size: 0.9rem; }
        .btn-submit:hover { opacity: 0.9; }
        
        .form-section { display: none; }
        .form-section.active { display: block; }
        
        .back-home { display: block; text-align: center; margin-top: 1.2rem; font-size: 0.8rem; color: var(--text-light); text-decoration: none; }
        .back-home:hover { color: var(--dark-color); }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <h1>Mobile Iran</h1>
            <p>به حساب کاربری خود وارد شوید یا ثبت‌نام کنید</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('login')">ورود</button>
            <button class="tab" onclick="switchTab('register')">ثبت‌نام</button>
        </div>

        <!-- فرم ورود -->
        <form id="loginForm" class="form-section active" onsubmit="handleAuth(event, 'ورود')">
            <div class="form-group">
                <label>ایمیل یا شماره موبایل</label>
                <input type="text" required placeholder="09123456789">
            </div>
            <div class="form-group">
                <label>رمز عبور</label>
                <input type="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-submit">ورود به حساب</button>
        </form>

        <!-- فرم ثبت‌نام -->
        <form id="registerForm" class="form-section" onsubmit="handleAuth(event, 'ثبت‌نام')">
            <div class="form-group">
                <label>نام و نام خانوادگی</label>
                <input type="text" required placeholder="علی حیدری">
            </div>
            <div class="form-group">
                <label>شماره موبایل یا ایمیل</label>
                <input type="text" required placeholder="09123456789">
            </div>
            <div class="form-group">
                <label>رمز عبور</label>
                <input type="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-submit">ساخت حساب کاربری</button>
        </form>

        <a href="index.html" class="back-home"><i class="fa-solid fa-arrow-right"></i> بازگشت به صفحه اصلی فروشگاه</a>
    </div>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));

            if (tabName === 'login') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
        }

        // بررسی پارامتر URL برای حالت ثبت‌نام پیش‌‌فرض (مثلا ?mode=register)
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('mode') === 'register') {
                switchTab('register');
            }
        }

        function handleAuth(e, type) {
            e.preventDefault();
            alert(`عملیات ${type} با موفقیت انجام شد!`);
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
