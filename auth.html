<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ورود / ثبت‌نام | Mobile Iran</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --dark-color: #1d1d1f; 
            --gray-bg: #f5f5f7; 
            --border-color: #e5e5ea; 
            --text-color: #1d1d1f; 
            --text-light: #86868b; 
            --accent-color: #007aff;
            --success: #34c759;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--gray-bg); color: var(--text-color); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; }
        
        .auth-card { background: #fff; border: 1px solid var(--border-color); width: 100%; max-width: 400px; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .logo-area { text-align: center; margin-bottom: 2rem; }
        .logo-area h1 { font-size: 1.4rem; font-weight: 800; color: var(--dark-color); margin-top: 0.5rem; }
        
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--dark-color); }
        .form-control { width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border-color); border-radius: 10px; font-size: 0.95rem; outline: none; transition: border-color 0.2s; font-family: inherit; }
        .form-control:focus { border-color: var(--accent-color); }
        
        .btn-submit { background: var(--dark-color); color: #fff; width: 100%; padding: 0.9rem; border: none; border-radius: 10px; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: background 0.2s; margin-top: 0.5rem; }
        .btn-submit:hover { background: #000; }
        
        .hidden { display: none !important; }
        .text-center { text-align: center; }
        .back-link { display: inline-block; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-light); text-decoration: none; }
        .back-link:hover { color: var(--dark-color); }
        .timer-text { font-size: 0.85rem; color: var(--text-light); margin-top: 0.8rem; text-align: center; }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="logo-area">
            <i class="fa-solid fa-mobile-screen-button" style="font-size: 2.5rem; color: var(--accent-color);"></i>
            <h1>موبایل ایران</h1>
        </div>

        <!-- مرحله اول: دریافت شماره موبایل -->
        <div id="step-mobile">
            <div class="form-group">
                <label>شماره موبایل خود را وارد کنید</label>
                <input type="tel" id="mobile_input" class="form-control" placeholder="09123456789" maxlength="11">
            </div>
            <button class="btn-submit" onclick="sendOtp()">ارسال کد تایید</button>
        </div>

        <!-- مرحله دوم: ورود کد تایید (OTP) -->
        <div id="step-otp" class="hidden">
            <div class="form-group">
                <label>کد تایید ارسال شده به <span id="display_mobile" style="color:var(--accent-color)"></span> را وارد کنید</label>
                <input type="text" id="otp_input" class="form-control text-center" placeholder="----" maxlength="6" style="letter-spacing: 5px; font-size: 1.2rem; font-weight: bold;">
            </div>
            <button class="btn-submit" onclick="verifyOtp()">تایید و ورود</button>
            <div id="timer" class="timer-text">ارسال مجدد کد تا چند لحظه دیگر...</div>
        </div>

        <div class="text-center">
            <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-right"></i> بازگشت به صفحه اصلی</a>
        </div>
    </div>

    <script>
        const API_URL = 'https://mobile-iran-api.mahdih1479mm.workers.dev';
        let userMobile = '';

        async function sendOtp() {
            const mobileInput = document.getElementById('mobile_input').value.trim();
            if (!mobileInput || !/^09\d{9}$/.test(mobileInput)) {
                alert('لطفا یک شماره موبایل معتبر ایرانی وارد کنید (مثال: 09123456789)');
                return;
            }

            userMobile = mobileInput;

            try {
                const response = await fetch(`${API_URL}/api/auth/send-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mobile: userMobile })
                });

                const result = await response.json();

                if (response.ok) {
                    document.getElementById('display_mobile').innerText = userMobile;
                    document.getElementById('step-mobile').classList.add('hidden');
                    document.getElementById('step-otp').classList.remove('hidden');
                    alert(result.message || 'کد تایید ارسال شد.');
                } else {
                    alert(result.error || 'خطا در ارسال کد تایید.');
                }
            } catch (error) {
                console.error('Network Error:', error);
                alert('خطا در ارتباط با سرور.');
            }
        }

        async function verifyOtp() {
            const otpInput = document.getElementById('otp_input').value.trim();
            if (!otpInput || otpInput.length < 4) {
                alert('لطفا کد تایید را به طور کامل وارد کنید.');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/auth/verify-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mobile: userMobile, code: otpInput })
                });

                const result = await response.json();

                if (response.ok) {
                    // ذخیره توکن احراز هویت در مرورگر
                    localStorage.setItem('mobileIranToken', result.token);
                    localStorage.setItem('mobileIranUser', JSON.stringify(result.user));
                    
                    alert('ورود با موفقیت انجام شد!');
                    
                    // بررسی اینکه آیا کاربر ادمین است یا خیر
                    if (result.user && result.user.isAdmin) {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                } else {
                    alert(result.error || 'کد تایید نامعتبر است.');
                }
            } catch (error) {
                console.error('Network Error:', error);
                alert('خطا در بررسی کد تایید.');
            }
        }
    </script>
</body>
</html>
