<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ورود / ثبت‌نام | Mobile Iran</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --dark-color: #1d1d1f; 
            --gray-bg: #f5f5f7; 
            --border-color: #e5e5ea; 
            --text-color: #1d1d1f; 
            --text-light: #86868b; 
            --accent-color: #007aff;
            --success: #34c759;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--gray-bg); color: var(--text-color); line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }
        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }

        /* هدر */
        header { background-color: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 1000; }
        .header-container { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0.8rem 1rem; }
        .logo { font-size: 1.2rem; font-weight: 800; color: var(--dark-color); }
        .nav-links { display: none; }
        .header-actions { display: flex; align-items: center; gap: 0.6rem; }
        .btn-action { background: var(--gray-bg); border: 1px solid var(--border-color); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; color: var(--dark-color); }
        
        .nav-links { display: flex; gap: 1.5rem; align-items: center; }
        .nav-links a { font-size: 0.9rem; color: var(--text-light); }
        .nav-links a:hover, .nav-links a.active { color: var(--dark-color); font-weight: 600; }

        /* ساختار صفحه ورود و ثبت نام */
        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
        
        .auth-card { background: #fff; width: 100%; max-width: 450px; border-radius: 20px; padding: 2rem; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); border: 1px solid var(--border-color); }
        
        /* تب ها */
        .auth-tabs { display: flex; border-bottom: 2px solid var(--gray-bg); margin-bottom: 2rem; }
        .tab-btn { flex: 1; background: none; border: none; padding: 1rem 0; font-size: 1rem; font-weight: 700; color: var(--text-light); cursor: pointer; transition: 0.3s; position: relative; }
        .tab-btn.active { color: var(--accent-color); }
        .tab-btn.active::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 100%; height: 2px; background: var(--accent-color); border-radius: 2px 2px 0 0; }

        /* فرم ها */
        .auth-form { display: none; flex-direction: column; gap: 1.2rem; animation: fadeIn 0.4s ease; }
        .auth-form.active { display: flex; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
        .form-group label { font-size: 0.85rem; font-weight: 600; color: var(--dark-color); }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper i { position: absolute; right: 1rem; color: var(--text-light); font-size: 1.1rem; }
        
        .form-control { width: 100%; padding: 0.9rem 2.8rem 0.9rem 1rem; border: 1px solid var(--border-color); border-radius: 12px; font-family: inherit; font-size: 0.95rem; outline: none; transition: border-color 0.2s, box-shadow 0.2s; background: var(--gray-bg); }
        .form-control:focus { border-color: var(--accent-color); background: #fff; box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1); }

        .forgot-pass { font-size: 0.8rem; color: var(--accent-color); align-self: flex-end; margin-top: -0.5rem; }

        .btn-submit { background: var(--dark-color); color: #fff; width: 100%; padding: 1rem; border: none; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 1rem; transition: background 0.2s; }
        .btn-submit:hover { background: #000; }
        .btn-submit:active { transform: scale(0.98); }

        footer { background-color: var(--gray-bg); border-top: 1px solid var(--border-color); padding: 2rem 1rem; text-align: center; color: var(--text-light); font-size: 0.8rem; margin-top: auto; }

        @media (max-width: 768px) {
            .nav-links { display: none; } /* مخفی کردن منوها در موبایل مانند سایر صفحات */
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo">Mobile Iran</div>
            <ul class="nav-links">
                <li><a href="index.html">خانه</a></li>
                <li><a href="products.html">محصولات</a></li>
                <li><a href="about.html">درباره ما</a></li>
            </ul>
            <div class="header-actions">
                <a href="cart.html" class="btn-action"><i class="fa-solid fa-bag-shopping"></i></a>
                <a href="auth.html" class="btn-action" style="color:var(--accent-color); border-color:var(--accent-color);"><i class="fa-solid fa-user"></i></a>
            </div>
        </div>
    </header>

    <main>
        <div class="auth-card">
            
            <div class="auth-tabs">
                <button class="tab-btn active" onclick="switchTab('login')">ورود</button>
                <button class="tab-btn" onclick="switchTab('register')">ثبت‌نام</button>
            </div>

            <!-- فرم ورود -->
            <form id="login-form" class="auth-form active" onsubmit="handleAuth(event, 'login')">
                <div class="form-group">
                    <label>شماره موبایل</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-phone"></i>
                        <input type="tel" class="form-control" placeholder="09123456789" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>رمز عبور</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" class="form-control" placeholder="رمز عبور خود را وارد کنید" required>
                    </div>
                </div>

                <a href="#" class="forgot-pass">رمز عبور خود را فراموش کرده‌اید؟</a>

                <button type="submit" class="btn-submit">ورود به حساب کاربری</button>
            </form>

            <!-- فرم ثبت‌نام -->
            <form id="register-form" class="auth-form" onsubmit="handleAuth(event, 'register')">
                <div class="form-group">
                    <label>نام و نام خانوادگی</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user"></i>
                        <input type="text" class="form-control" placeholder="مثال: مهدی حشمتی" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>شماره موبایل</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-phone"></i>
                        <input type="tel" class="form-control" placeholder="09123456789" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>رمز عبور</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" class="form-control" placeholder="حداقل ۶ کاراکتر" required minlength="6">
                    </div>
                </div>

                <button type="submit" class="btn-submit">ثبت‌نام در فروشگاه</button>
            </form>

        </div>
    </main>

    <footer><p>تمامی حقوق محفوظ است | <strong>Mobile Iran</strong></p></footer>

    <script>
        // تابع جابجایی بین تب ورود و ثبت‌نام
        function switchTab(tabId) {
            // حذف کلاس فعال از همه تب‌ها و فرم‌ها
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));
            
            // اضافه کردن کلاس فعال به تب و فرم انتخاب شده
            if (tabId === 'login') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('login-form').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('register-form').classList.add('active');
            }
        }

        // تابع مدیریت دکمه‌های ورود و ثبت‌نام (شبیه‌ساز)
        function handleAuth(event, type) {
            event.preventDefault(); // جلوگیری از رفرش شدن صفحه

            if (type === 'login') {
                alert('ورود با موفقیت انجام شد! در حال انتقال به صفحه اصلی...');
            } else if (type === 'register') {
                alert('ثبت‌نام با موفقیت انجام شد! در حال انتقال به صفحه اصلی...');
            }

            // ذخیره یک مقدار تستی در لوکال استوریج برای نشان دادن اینکه کاربر لاگین است
            localStorage.setItem('userIsLoggedIn', 'true');
            
            // انتقال به صفحه اصلی
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
