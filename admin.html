<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>پنل مدیریت - موبایل ایران</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f4f9; padding: 20px; }
        form { background: #fff; padding: 20px; border-radius: 8px; max-width: 400px; margin: auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #28a745; color: white; padding: 10px; border: none; width: 100%; border-radius: 4px; cursor: pointer; }
        button:hover { background: #218838; }
    </style>
</head>
<body>
    <h2 style="text-align: center;">افزودن محصول جدید</h2>
    <form id="product-form">
        <input type="text" id="name" placeholder="نام محصول" required>
        <input type="number" id="price" placeholder="قیمت (تومان)" required>
        <input type="text" id="category" placeholder="دسته‌بندی">
        <input type="text" id="image" placeholder="لینک تصویر">
        <textarea id="description" placeholder="توضیحات محصول"></textarea>
        <button type="submit">ثبت و ذخیره در دیتابیس</button>
    </form>

    <script>
        const API_BASE = "https://mobile-iran.mahdih1479mm.workers.dev";

        document.getElementById("product-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const productData = {
                name: document.getElementById("name").value,
                price: document.getElementById("price").value,
                category: document.getElementById("category").value,
                image: document.getElementById("image").value,
                description: document.getElementById("description").value
            };

            try {
                const res = await fetch(`${API_BASE}/api/products`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(productData)
                });
                const result = await res.json();
                if (result.success) {
                    alert("محصول با موفقیت به دیتابیس اضافه شد!");
                    document.getElementById("product-form").reset();
                } else {
                    alert("خطا در ثبت محصول");
                }
            } catch (err) {
                alert("خطا در اتصال به سرور");
            }
        });
    </script>
</body>
</html>
