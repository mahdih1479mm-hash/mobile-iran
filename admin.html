<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت | Mobile Iran</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* استایل‌های هماهنگ با تم اصلی سایت */
        :root { 
            --dark-color: #1d1d1f; 
            --gray-bg: #f5f5f7; 
            --border-color: #e5e5ea; 
            --text-color: #1d1d1f; 
            --text-light: #86868b; 
            --accent-color: #007aff;
            --success: #34c759;
            --danger: #ff3b30;
            --sidebar-width: 260px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
        body { background-color: var(--gray-bg); color: var(--text-color); min-height: 100vh; overflow-x: hidden; }

        /* --- صفحه ورود --- */
        #login-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .login-card {
            background: #fff;
            border: 1px solid var(--border-color);
            padding: 2.5rem 2rem;
            border-radius: 20px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .login-card h2 { font-weight: 800; font-size: 1.4rem; color: var(--dark-color); margin-bottom: 0.4rem; }
        .login-card p { color: var(--text-light); font-size: 0.85rem; margin-bottom: 2rem; }

        .input-box { position: relative; margin-bottom: 1.2rem; }
        .input-box input {
            width: 100%;
            padding: 0.9rem 1rem 0.9rem 2.8rem;
            background: var(--gray-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }
        .input-box input:focus { border-color: var(--accent-color); background: #fff; }
        .input-box i { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-light); }

        .btn-glow {
            width: 100%;
            padding: 0.9rem;
            background: var(--dark-color);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-glow:hover { opacity: 0.9; }

        /* --- داشبورد اصلی --- */
        #dashboard-wrapper { display: none; min-height: 100vh; }

        .sidebar {
            width: var(--sidebar-width);
            background: #fff;
            border-left: 1px solid var(--border-color);
            position: fixed;
            right: 0; top: 0; bottom: 0;
            padding: 2rem 1.2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .brand { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 2.5rem; }
        .brand-text h3 { font-size: 1.2rem; font-weight: 800; color: var(--dark-color); }

        .menu-list { list-style: none; }
        .menu-item {
            display: flex; align-items: center; gap: 0.8rem;
            padding: 0.85rem 1rem;
            color: var(--text-light);
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.4rem;
            transition: all 0.2s;
        }
        .menu-item:hover { background: var(--gray-bg); color: var(--dark-color); }
        .menu-item.active { background: #e8f4fd; color: var(--accent-color); }

        .btn-logout {
            display: flex; align-items: center; gap: 0.8rem;
            padding: 0.85rem 1rem;
            color: var(--danger);
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .btn-logout:hover { background: #fff0f0; border-color: var(--danger); }

        .content-area { margin-right: var(--sidebar-width); padding: 2.5rem; width: 100%; }

        .section-header { margin-bottom: 2rem; }
        .section-header h2 { font-size: 1.5rem; font-weight: 800; color: var(--dark-color); }

        .tab-panel { display: none; }
        .tab-panel.active { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        /* فرم‌ها و کارت‌ها */
        .glass-card {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 1.8rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 16px rgba(0,0,0,0.02);
        }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.2rem; }
        .field { display: flex; flex-direction: column; gap: 0.4rem; }
        .field label { font-size: 0.82rem; color: var(--dark-color); font-weight: 600; }
        .field input, .field select {
            background: var(--gray-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 0.75rem 1rem;
            color: var(--text-color);
            outline: none;
            font-size: 0.9rem;
        }
        .field input:focus, .field select:focus { border-color: var(--accent-color); background: #fff; }
        .field.full { grid-column: 1 / -1; }

        .form-actions { display: flex; gap: 0.8rem; margin-top: 1.5rem; }
        .btn-save { background: var(--dark-color); color: #fff; padding: 0.75rem 2rem; border-radius: 10px; border: none; font-weight: 700; cursor: pointer; }
        .btn-cancel { background: transparent; color: var(--text-light); padding: 0.75rem 1.5rem; border-radius: 10px; border: 1px solid var(--border-color); cursor: pointer; }

        /* جداول */
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: right; font-size: 0.9rem; }
        th { color: var(--text-light); padding: 1rem; border-bottom: 1px solid var(--border-color); font-weight: 600; font-size: 0.85rem; }
        td { padding: 1.1rem 1rem; border-bottom: 1px solid var(--border-color); vertical-align: middle; color: var(--text-color); }
        tr:hover td { background: var(--gray-bg); }

        .thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border-color); background: #fff; }
        .badge { display: inline-block; padding: 0.3rem 0.7rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
        .badge-special { background: #fff3e0; color: #f57c00; }
        .badge-normal { background: var(--gray-bg); color: var(--text-light); }
        .badge-status { background: #e8f5e9; color: var(--success); }

        .action-btns { display: flex; gap: 0.5rem; }
        .icon-btn {
            width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border-color);
            background: #fff; color: var(--text-color);
            display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;
        }
        .icon-btn.del { color: var(--danger); }
        .icon-btn.del:hover { background: #fff0f0; border-color: var(--danger); }
    </style>
</head>
<body>

    <!-- صفحه ورود -->
    <div id="login-wrapper">
        <div class="login-card">
            <h2>مدیریت Mobile Iran</h2>
            <p>جهت دسترسی به داشبورد رمز عبور را وارد کنید</p>

            <form onsubmit="handleLogin(event)">
                <div class="input-box">
                    <input type="password" id="passInput" placeholder="رمز عبور ادمین" required>
                    <i class="fa-solid fa-lock"></i>
                </div>
                <button type="submit" class="btn-glow">ورود به پنل</button>
            </form>
        </div>
    </div>

    <!-- داشبورد اصلی -->
    <div id="dashboard-wrapper">
        <aside class="sidebar">
            <div>
                <div class="brand">
                    <div class="brand-text">
                        <h3>Mobile Iran</h3>
                    </div>
                </div>

                <ul class="menu-list">
                    <li class="menu-item active" onclick="switchPanel('products', event)">
                        <i class="fa-solid fa-box"></i> محصولات
                    </li>
                    <li class="menu-item" onclick="switchPanel('orders', event)">
                        <i class="fa-solid fa-bag-shopping"></i> سفارشات
                    </li>
                    <li class="menu-item" onclick="switchPanel('users', event)">
                        <i class="fa-solid fa-users"></i> کاربران
                    </li>
                </ul>
            </div>

            <button class="btn-logout" onclick="logout()">
                <i class="fa-solid fa-right-from-bracket"></i> خروج
            </button>
        </aside>

        <main class="content-area">

            <!-- تب محصولات -->
            <div id="panel-products" class="tab-panel active">
                <div class="section-header"><h2>مدیریت محصولات</h2></div>

                <div class="glass-card">
                    <h3 id="formTitle" style="font-size: 1rem; margin-bottom: 1.2rem; font-weight: 700;">افزودن محصول جدید</h3>
                    <form id="productForm" onsubmit="saveProduct(event)">
                        <input type="hidden" id="p_id">
                        <div class="form-grid">
                            <div class="field">
                                <label>نام محصول</label>
                                <input type="text" id="p_name" placeholder="مثلا آیفون ۱۵ پرومکس" required>
                            </div>
                            <div class="field">
                                <label>دسته‌بندی</label>
                                <select id="p_category" required>
                                    <option value="قاب‌ها (Cases)">قاب‌ها (Cases)</option>
                                    <option value="مگ‌سیف (MagSafe)">مگ‌سیف (MagSafe)</option>
                                    <option value="کابل و مبدل (Cables)">کابل و مبدل (Cables)</option>
                                    <option value="شارژر وایرلس (Charger)">شارژر وایرلس (Charger)</option>
                                    <option value="پاوربانک (Power Banks)">پاوربانک (Power Banks)</option>
                                </select>
                            </div>
                            <div class="field">
                                <label>قیمت اصلی (تومان)</label>
                                <input type="text" id="p_price" placeholder="مثال: ۳۵۰,۰۰۰" required>
                            </div>
                            <div class="field">
                                <label>قیمت با تخفیف (اختیاری)</label>
                                <input type="text" id="p_discount" placeholder="در صورت نیاز">
                            </div>
                            <div class="field">
                                <label>بخش نمایش</label>
                                <select id="p_section">
                                    <option value="normal">عادی</option>
                                    <option value="special">پیشنهاد ویژه</option>
                                </select>
                            </div>
                            <div class="field">
                                <label>لینک تصویر</label>
                                <input type="text" id="p_image" placeholder="https://..." required>
                            </div>
                            <div class="field full">
                                <label>توضیحات کوتاه</label>
                                <input type="text" id="p_desc" placeholder="توضیحات مختصر...">
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn-save">ذخیره محصول</button>
                            <button type="button" class="btn-cancel" onclick="resetForm()">انصراف</button>
                        </div>
                    </form>
                </div>

                <div class="glass-card table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>تصویر</th>
                                <th>نام محصول</th>
                                <th>دسته‌بندی</th>
                                <th>قیمت</th>
                                <th>بخش</th>
                                <th>عملیات</th>
                            </tr>
                        </thead>
                        <tbody id="productsTable">
                            <!-- لود محصولات -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- تب سفارشات -->
            <div id="panel-orders" class="tab-panel">
                <div class="section-header"><h2>سفارشات</h2></div>
                <div class="glass-card table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>نام مشتری</th>
                                <th>شماره تماس</th>
                                <th>مبلغ کل</th>
                                <th>تاریخ</th>
                                <th>عملیات</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTable">
                            <!-- لود سفارشات -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- تب کاربران -->
            <div id="panel-users" class="tab-panel">
                <div class="section-header"><h2>لیست کاربران</h2></div>
                <div class="glass-card table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>نام کاربر</th>
                                <th>شماره / ایمیل</th>
                                <th>تاریخ عضویت</th>
                            </tr>
                        </thead>
                        <tbody id="usersTable">
                            <!-- لود داینامیک کاربران -->
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <script>
        const API_BASE = "https://mobile-iran-api.mahdih1479mm.workers.dev";

        // ورود به پنل
        function handleLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('passInput').value;
            // بررسی رمز عبور جدید
            if (pass === '@mobileIRAN') { 
                document.getElementById('login-wrapper').style.display = 'none';
                document.getElementById('dashboard-wrapper').style.display = 'flex';
                // دریافت اطلاعات پس از ورود موفق
                fetchUsers();
                fetchProductsAdmin();
                fetchOrders();
            } else {
                alert('رمز عبور نادرست است!');
            }
        }

        function logout() {
            document.getElementById('login-wrapper').style.display = 'flex';
            document.getElementById('dashboard-wrapper').style.display = 'none';
            document.getElementById('passInput').value = '';
        }

        function switchPanel(name, event) {
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
            document.getElementById('panel-' + name).classList.add('active');
        }

        // --- بخش کاربران ---
        async function fetchUsers() {
            try {
                const res = await fetch(`${API_BASE}/api/users`);
                const users = await res.json();
                const tbody = document.getElementById('usersTable');
                tbody.innerHTML = '';
                
                if (users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">کاربری یافت نشد</td></tr>';
                    return;
                }

                users.forEach(user => {
                    const date = new Date(user.created_at).toLocaleDateString('fa-IR');
                    tbody.innerHTML += `
                        <tr>
                            <td>${user.name}</td>
                            <td>${user.phone_or_email}</td>
                            <td>${date}</td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error("Error fetching users", err);
            }
        }

        // --- بخش محصولات ---
        async function fetchProductsAdmin() {
            try {
                const res = await fetch(`${API_BASE}/api/products`);
                const products = await res.json();
                const tbody = document.getElementById('productsTable');
                tbody.innerHTML = '';

                if (products.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">محصولی یافت نشد</td></tr>';
                    return;
                }

                products.forEach(p => {
                    const badgeClass = p.section === 'special' ? 'badge-special' : 'badge-normal';
                    const sectionName = p.section === 'special' ? 'پیشنهاد ویژه' : 'عادی';
                    tbody.innerHTML += `
                        <tr>
                            <td><img src="${p.image}" class="thumb"></td>
                            <td>${p.name}</td>
                            <td>${p.category}</td>
                            <td>${p.price}</td>
                            <td><span class="badge ${badgeClass}">${sectionName}</span></td>
                            <td>
                                <div class="action-btns">
                                    <button class="icon-btn del" onclick="deleteProduct(${p.id})"><i class="fa-solid fa-trash-can"></i></button>
                                </div>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error("Error fetching products", err);
            }
        }

        async function saveProduct(e) {
            e.preventDefault();
            const newProduct = {
                name: document.getElementById('p_name').value,
                category: document.getElementById('p_category').value,
                price: document.getElementById('p_price').value,
                discount_price: document.getElementById('p_discount').value,
                section: document.getElementById('p_section').value,
                image: document.getElementById('p_image').value,
                description: document.getElementById('p_desc').value
            };

            try {
                const res = await fetch(`${API_BASE}/api/products`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newProduct)
                });
                const result = await res.json();
                if(result.success) {
                    alert('محصول با موفقیت ذخیره شد!');
                    resetForm();
                    fetchProductsAdmin(); // آپدیت جدول
                } else {
                    alert('خطا در ذخیره محصول.');
                }
            } catch (error) {
                alert('خطا در ارتباط با سرور.');
            }
        }

        async function deleteProduct(id) {
            if(confirm("آیا از حذف این محصول اطمینان دارید؟")) {
                try {
                    const res = await fetch(`${API_BASE}/api/products/${id}`, { method: 'DELETE' });
                    const result = await res.json();
                    if(result.success) {
                        alert('محصول حذف شد.');
                        fetchProductsAdmin(); // آپدیت جدول
                    }
                } catch (error) {
                    alert('خطا در حذف محصول.');
                }
            }
        }

        function resetForm() {
            document.getElementById('productForm').reset();
            document.getElementById('p_id').value = '';
        }

        // --- بخش سفارشات ---
        async function fetchOrders() {
            try {
                const res = await fetch(`${API_BASE}/api/orders`);
                const orders = await res.json();
                const tbody = document.getElementById('ordersTable');
                tbody.innerHTML = '';
                
                if (orders.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">سفارشی ثبت نشده است</td></tr>';
                    return;
                }

                orders.forEach(order => {
                    const date = new Date(order.created_at).toLocaleDateString('fa-IR');
                    tbody.innerHTML += `
                        <tr>
                            <td>${order.user_name}</td>
                            <td>${order.phone}</td>
                            <td>${order.total_amount.toLocaleString()} تومان</td>
                            <td>${date}</td>
                            <td><span class="badge badge-normal">در حال بررسی</span></td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error("Error fetching orders", err);
            }
        }
    </script>
</body>
</html>
