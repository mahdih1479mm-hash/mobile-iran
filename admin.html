<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد مدیریت | Mobile Iran</title>
    <link href="[https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css](https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css)" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
    <style>
        :root { --dark-color: #1d1d1f; --gray-bg: #f5f5f7; --border-color: #e5e5ea; --text-light: #86868b; --blue: #0071e3; --red: #ff3b30; --green: #34c759; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
        body { background-color: var(--gray-bg); color: var(--dark-color); overflow-x: hidden; }
        
        /* صفحه ورود ادمین */
        #login-section { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; }
        .login-box { background: #fff; padding: 2.5rem 2rem; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 350px; text-align: center; border: 1px solid var(--border-color); }
        .login-box h2 { margin-bottom: 1.5rem; font-weight: 800; }
        .input-group { margin-bottom: 1rem; text-align: right; }
        .input-group input { width: 100%; padding: 0.8rem; border: 1px solid var(--border-color); border-radius: 10px; outline: none; }
        .btn-primary { background: var(--blue); color: #fff; border: none; padding: 0.8rem; border-radius: 10px; width: 100%; cursor: pointer; font-weight: bold; }
        
        /* داشبورد */
        #dashboard-section { display: none; min-height: 100vh; }
        .sidebar { width: 250px; background: #fff; border-left: 1px solid var(--border-color); position: fixed; right: 0; top: 0; bottom: 0; padding: 1.5rem 1rem; }
        .sidebar h1 { font-size: 1.2rem; font-weight: 800; margin-bottom: 2rem; text-align: center; color: var(--dark-color); }
        .nav-btn { width: 100%; text-align: right; background: none; border: none; padding: 0.8rem 1rem; margin-bottom: 0.5rem; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--text-light); transition: 0.2s; }
        .nav-btn:hover { background: var(--gray-bg); color: var(--dark-color); }
        .nav-btn.active { background: var(--dark-color); color: #fff; }
        .nav-btn i { margin-left: 8px; }

        .main-content { margin-right: 250px; padding: 2rem; }
        .panel { display: none; background: #fff; border-radius: 16px; padding: 1.5rem; border: 1px solid var(--border-color); }
        .panel.active { display: block; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.85rem; margin-bottom: 0.4rem; font-weight: 600; }
        .form-group input, .form-group select { width: 100%; padding: 0.7rem; border: 1px solid var(--border-color); border-radius: 10px; outline: none; }
        .form-group.full { grid-column: 1 / -1; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.9rem; }
        th, td { padding: 1rem; text-align: right; border-bottom: 1px solid var(--border-color); }
        th { color: var(--text-light); font-weight: 600; }
        .action-btn { background: none; border: none; cursor: pointer; padding: 0.4rem; margin-left: 0.3rem; border-radius: 6px; }
        .btn-edit { color: var(--blue); }
        .btn-delete { color: var(--red); }
        .btn-edit:hover { background: rgba(0, 113, 227, 0.1); }
        .btn-delete:hover { background: rgba(255, 59, 48, 0.1); }
        
        .badge { padding: 0.3rem 0.6rem; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
        .badge-pending { background: #fff5eb; color: #ff9500; }
    </style>
</head>
<body>

    <!-- ورود ادمین -->
    <div id="login-section">
        <div class="login-box">
            <h2>ورود مدیریت</h2>
            <div class="input-group">
                <input type="password" id="adminPass" placeholder="رمز عبور ادمین را وارد کنید">
            </div>
            <button class="btn-primary" onclick="checkLogin()">ورود به پنل</button>
        </div>
    </div>

    <!-- داشبورد اصلی -->
    <div id="dashboard-section">
        <aside class="sidebar">
            <h1>Mobile Iran <br><span style="font-size:0.8rem; color:#86868b">پنل مدیریت</span></h1>
            <button class="nav-btn active" onclick="switchTab('products', event)"><i class="fa-solid fa-box"></i> محصولات</button>
            <button class="nav-btn" onclick="switchTab('orders', event)"><i class="fa-solid fa-shopping-cart"></i> سفارشات</button>
            <button class="nav-btn" onclick="switchTab('users', event)"><i class="fa-solid fa-users"></i> کاربران</button>
            <button class="nav-btn" style="margin-top: 2rem; color: var(--red);" onclick="logout()"><i class="fa-solid fa-sign-out-alt"></i> خروج</button>
        </aside>

        <main class="main-content">
            
            <!-- محصولات -->
            <div id="panel-products" class="panel active">
                <h2 style="margin-bottom: 1.5rem;">مدیریت محصولات</h2>
                
                <form id="productForm" onsubmit="saveProduct(event)" style="background: var(--gray-bg); padding: 1.5rem; border-radius: 12px; margin-bottom: 2rem;">
                    <h3 id="formTitle" style="font-size: 1rem; margin-bottom: 1rem;">افزودن محصول جدید</h3>
                    <input type="hidden" id="editProductId">
                    <div class="form-grid">
                        <div class="form-group"><label>نام محصول</label><input type="text" id="p_name" required></div>
                        <div class="form-group"><label>دسته‌بندی</label><input type="text" id="p_category" required></div>
                        <div class="form-group"><label>قیمت اصلی (تومان)</label><input type="text" id="p_price" required></div>
                        <div class="form-group"><label>قیمت با تخفیف (اختیاری)</label><input type="text" id="p_discount" placeholder="مثلا ۲۹۰,۰۰۰"></div>
                        <div class="form-group">
                            <label>بخش نمایش در سایت</label>
                            <select id="p_section">
                                <option value="normal">عادی</option>
                                <option value="special">پیشنهاد ویژه (ویژه)</option>
                                <option value="new">جدیدترین‌ها</option>
                            </select>
                        </div>
                        <div class="form-group"><label>لینک تصویر</label><input type="text" id="p_image" required></div>
                        <div class="form-group full"><label>توضیحات کوتاه</label><input type="text" id="p_desc"></div>
                    </div>
                    <button type="submit" class="btn-primary" style="width: auto; padding: 0.6rem 2rem;">ذخیره محصول</button>
                    <button type="button" class="btn-primary" style="background:var(--text-light); width: auto; padding: 0.6rem 2rem;" onclick="resetForm()">انصراف</button>
                </form>

                <table>
                    <thead>
                        <tr>
                            <th>تصویر</th>
                            <th>نام محصول</th>
                            <th>قیمت / تخفیف</th>
                            <th>بخش</th>
                            <th>عملیات</th>
                        </tr>
                    </thead>
                    <tbody id="productsTableBody"></tbody>
                </table>
            </div>

            <!-- سفارشات -->
            <div id="panel-orders" class="panel">
                <h2 style="margin-bottom: 1.5rem;">سفارشات ثبت شده</h2>
                <table>
                    <thead>
                        <tr>
                            <th>شماره/تاریخ</th>
                            <th>نام مشتری</th>
                            <th>شماره تماس</th>
                            <th>مبلغ کل</th>
                            <th>وضعیت</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody"></tbody>
                </table>
            </div>

            <!-- کاربران -->
            <div id="panel-users" class="panel">
                <h2 style="margin-bottom: 1.5rem;">لیست کاربران</h2>
                <table>
                    <thead>
                        <tr>
                            <th>شناسه</th>
                            <th>نام و نام خانوادگی</th>
                            <th>شماره/ایمیل</th>
                            <th>تاریخ ثبت‌نام</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody"></tbody>
                </table>
            </div>

        </main>
    </div>

    <script>
        // آدرس سرور ابری کلادفلر شما
        const API_BASE = "[https://mobile-iran-api.mahdih1479mm.workers.dev](https://mobile-iran-api.mahdih1479mm.workers.dev)";

        function checkLogin() {
            const pass = document.getElementById('adminPass').value;
            if (pass === 'admin123') {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('dashboard-section').style.display = 'block';
                loadProducts();
            } else {
                alert('رمز عبور نادرست است!');
            }
        }

        function logout() {
            document.getElementById('login-section').style.display = 'flex';
            document.getElementById('dashboard-section').style.display = 'none';
            document.getElementById('adminPass').value = '';
        }

        function switchTab(tab, e) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            
            e.currentTarget.classList.add('active');
            document.getElementById('panel-' + tab).classList.add('active');

            if(tab === 'products') loadProducts();
            if(tab === 'orders') loadOrders();
            if(tab === 'users') loadUsers();
        }

        let currentProducts = [];

        async function loadProducts() {
            try {
                let res = await fetch(`${API_BASE}/api/products`);
                currentProducts = await res.json();
                renderProductsTable();
            } catch (err) { console.error("خطا در لود محصولات:", err); }
        }

        function renderProductsTable() {
            const tbody = document.getElementById('productsTableBody');
            tbody.innerHTML = '';
            currentProducts.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td><img src="${p.image}" width="40" height="40" style="border-radius:8px; object-fit:cover"></td>
                        <td>${p.name}</td>
                        <td>
                            ${p.price}
                            ${p.discount_price ? `<br><small style="color:var(--red)">تخفیف: ${p.discount_price}</small>` : ''}
                        </td>
                        <td><span class="badge" style="background:#e5e5ea; color:#1d1d1f">${p.section || 'عادی'}</span></td>
                        <td>
                            <button class="action-btn btn-edit" onclick="editProduct(${p.id})"><i class="fa-solid fa-pen"></i></button>
                            <button class="action-btn btn-delete" onclick="deleteProduct(${p.id})"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        async function saveProduct(e) {
            e.preventDefault();
            const id = document.getElementById('editProductId').value;
            const data = {
                name: document.getElementById('p_name').value,
                category: document.getElementById('p_category').value,
                price: document.getElementById('p_price').value,
                discount_price: document.getElementById('p_discount').value,
                section: document.getElementById('p_section').value,
                image: document.getElementById('p_image').value,
                description: document.getElementById('p_desc').value
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_BASE}/api/products/${id}` : `${API_BASE}/api/products`;

            try {
                let res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                let result = await res.json();
                if(res.ok && result.success) {
                    alert('محصول با موفقیت ذخیره شد!');
                    resetForm();
                    loadProducts();
                } else {
                    alert('خطا در ذخیره‌سازی: ' + (result.error || 'خطای نا مشخص'));
                }
            } catch (err) { alert('خطا در ارتباط با سرور ابری کلادفلر.'); }
        }

        function editProduct(id) {
            const p = currentProducts.find(x => x.id === id);
            if(p) {
                document.getElementById('editProductId').value = p.id;
                document.getElementById('p_name').value = p.name;
                document.getElementById('p_category').value = p.category;
                document.getElementById('p_price').value = p.price;
                document.getElementById('p_discount').value = p.discount_price || '';
                document.getElementById('p_section').value = p.section || 'normal';
                document.getElementById('p_image').value = p.image;
                document.getElementById('p_desc').value = p.description || '';
                document.getElementById('formTitle').innerText = 'ویرایش محصول';
                window.scrollTo(0,0);
            }
        }

        async function deleteProduct(id) {
            if(confirm('آیا از حذف این محصول اطمینان دارید؟')) {
                try {
                    await fetch(`${API_BASE}/api/products/${id}`, { method: 'DELETE' });
                    loadProducts();
                } catch(err) { alert('خطا در حذف محصول'); }
            }
        }

        function resetForm() {
            document.getElementById('productForm').reset();
            document.getElementById('editProductId').value = '';
            document.getElementById('formTitle').innerText = 'افزودن محصول جدید';
        }

        async function loadOrders() {
            try {
                let res = await fetch(`${API_BASE}/api/orders`);
                let orders = await res.json();
                const tbody = document.getElementById('ordersTableBody');
                tbody.innerHTML = '';
                orders.forEach(o => {
                    tbody.innerHTML += `
                        <tr>
                            <td>#ORD-${o.id}</td>
                            <td>${o.user_name}</td>
                            <td>${o.phone}</td>
                            <td>${o.total_amount} تومان</td>
                            <td><span class="badge badge-pending">${o.status || 'در حال بررسی'}</span></td>
                        </tr>
                    `;
                });
            } catch (err) { console.error(err); }
        }

        async function loadUsers() {
            try {
                let res = await fetch(`${API_BASE}/api/users`);
                let users = await res.json();
                const tbody = document.getElementById('usersTableBody');
                tbody.innerHTML = '';
                users.forEach(u => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${u.id}</td>
                            <td>${u.name}</td>
                            <td>${u.phone_or_email}</td>
                            <td>${new Date(u.created_at).toLocaleDateString('fa-IR')}</td>
                        </tr>
                    `;
                });
            } catch (err) { console.error(err); }
        }
    </script>
</body>
</html>
