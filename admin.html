<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>پنل مدیریت | Mobile Iran</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --dark-color: #1d1d1f; --gray-bg: #f5f5f7; --border-color: #e5e5ea; --text-color: #1d1d1f; --text-light: #86868b; --accent-color: #007aff; --success: #34c759; --danger: #ff3b30; --warning: #ff9500; --sidebar-width: 250px; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
        body { background-color: var(--gray-bg); color: var(--text-color); min-height: 100vh; overflow-x: hidden; }

        /* Login */
        #login-wrapper { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; }
        .login-card { background: #fff; border: 1px solid var(--border-color); padding: 2.5rem 2rem; border-radius: 20px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .login-card h2 { font-weight: 800; font-size: 1.4rem; color: var(--dark-color); margin-bottom: 0.4rem; }
        .input-box { position: relative; margin-bottom: 1.5rem; margin-top: 1.5rem; }
        .input-box input { width: 100%; padding: 1rem 1rem 1rem 2.8rem; background: var(--gray-bg); border: 1px solid var(--border-color); border-radius: 12px; font-size: 0.95rem; outline: none; }
        .input-box input:focus { border-color: var(--accent-color); background: #fff; }
        .input-box i { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-light); }
        .btn-glow { width: 100%; padding: 1rem; background: var(--dark-color); color: #fff; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; }

        /* Dashboard & Mobile Menu */
        #dashboard-wrapper { display: none; min-height: 100vh; flex-direction: row; }
        .mobile-header { display: none; background: #fff; padding: 1rem; border-bottom: 1px solid var(--border-color); justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1001; }
        .btn-menu-toggle { background: none; border: none; font-size: 1.5rem; color: var(--dark-color); cursor: pointer; }
        
        .sidebar { width: var(--sidebar-width); background: #fff; border-left: 1px solid var(--border-color); position: fixed; right: 0; top: 0; bottom: 0; padding: 2rem 1.2rem; display: flex; flex-direction: column; justify-content: space-between; transition: 0.3s ease; z-index: 1000; }
        .brand h3 { font-size: 1.2rem; font-weight: 800; margin-bottom: 2.5rem; text-align: center; }
        .menu-list { list-style: none; }
        .menu-item { display: flex; align-items: center; gap: 0.8rem; padding: 0.85rem 1rem; color: var(--text-light); border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 0.9rem; margin-bottom: 0.4rem; }
        .menu-item.active { background: #e8f4fd; color: var(--accent-color); }
        .btn-logout { display: flex; align-items: center; gap: 0.8rem; padding: 0.85rem 1rem; color: var(--danger); border: 1px solid var(--border-color); border-radius: 12px; cursor: pointer; background: transparent; font-weight: 600; }

        .content-area { margin-right: var(--sidebar-width); padding: 2rem; width: 100%; transition: 0.3s; }
        .section-header { margin-bottom: 1.5rem; font-size: 1.4rem; font-weight: 800; color: var(--dark-color); }
        .tab-panel { display: none; animation: fadeIn 0.3s ease; }
        .tab-panel.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Forms & Tables */
        .glass-card { background: #fff; border: 1px solid var(--border-color); border-radius: 16px; padding: 1.5rem; margin-bottom: 2rem; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
        .field { display: flex; flex-direction: column; gap: 0.4rem; }
        .field label { font-size: 0.82rem; font-weight: 600; }
        .field input, .field select { background: var(--gray-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 0.75rem 1rem; outline: none; font-size: 0.9rem; font-family: inherit;}
        .field input:focus, .field select:focus { border-color: var(--accent-color); background: #fff; }
        .field.full { grid-column: 1 / -1; }
        
        .admin-category-filters { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 1rem; margin-bottom: 1rem; scrollbar-width: none;}
        .admin-category-filters::-webkit-scrollbar { display: none; }
        .cat-btn { padding: 0.5rem 1rem; background: var(--gray-bg); border: 1px solid var(--border-color); border-radius: 20px; font-size: 0.8rem; cursor: pointer; white-space: nowrap; }
        .cat-btn.active { background: var(--dark-color); color: #fff; border-color: var(--dark-color); }

        .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; text-align: right; font-size: 0.85rem; min-width: 600px;}
        th { color: var(--text-light); padding: 1rem; border-bottom: 1px solid var(--border-color); font-weight: 600; }
        td { padding: 1rem; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
        .thumb { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border-color); }
        
        .badge { display: inline-block; padding: 0.3rem 0.7rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
        .badge-pending { background: #fff3e0; color: var(--warning); }
        .badge-completed { background: #e8f5e9; color: var(--success); }
        .badge-cancelled { background: #ffebee; color: var(--danger); }
        .badge-failed { background: #fce4ec; color: #c2185b; }
        
        .order-details-box { font-size: 0.85rem; color: var(--text-light); line-height: 1.8; margin-top: 0.5rem; background: var(--gray-bg); padding: 0.8rem; border-radius: 8px; border: 1px dashed var(--border-color); }
        
        .status-select { padding: 0.4rem; border-radius: 8px; border: 1px solid var(--border-color); font-family: inherit; font-size: 0.8rem; outline: none; background: #fff; }
        .action-btns { display: flex; gap: 0.4rem; }
        .icon-btn { padding: 0.4rem 0.6rem; border-radius: 8px; border: 1px solid var(--border-color); background: #fff; cursor: pointer; font-size: 0.8rem;}
        .icon-btn.reply { color: var(--accent-color); border-color: var(--accent-color); }
        
        @media (max-width: 768px) {
            #dashboard-wrapper { flex-direction: column; }
            .mobile-header { display: flex; }
            .sidebar { transform: translateX(100%); }
            .sidebar.open { transform: translateX(0); box-shadow: -5px 0 15px rgba(0,0,0,0.1); }
            .content-area { margin-right: 0; padding: 1rem; }
        }
    </style>
</head>
<body>

    <!-- صفحه ورود -->
    <div id="login-wrapper">
        <div class="login-card">
            <h2>پنل مدیریت</h2>
            <form onsubmit="handleLogin(event)">
                <div class="input-box"><input type="password" id="passInput" placeholder="رمز عبور ادمین" required><i class="fa-solid fa-lock"></i></div>
                <button type="submit" class="btn-glow">ورود</button>
            </form>
        </div>
    </div>

    <!-- هدر موبایل -->
    <div class="mobile-header" id="mobileHeader">
        <div class="brand"><h3 style="margin:0;">Mobile Iran</h3></div>
        <button class="btn-menu-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
    </div>

    <!-- داشبورد اصلی -->
    <div id="dashboard-wrapper">
        <aside class="sidebar" id="sidebar">
            <div>
                <div class="brand"><h3>Mobile Iran</h3></div>
                <ul class="menu-list">
                    <li class="menu-item active" onclick="switchPanel('products', event)"><i class="fa-solid fa-box"></i> محصولات</li>
                    <li class="menu-item" onclick="switchPanel('orders', event)"><i class="fa-solid fa-bag-shopping"></i> سفارشات</li>
                    <li class="menu-item" onclick="switchPanel('reviews', event)"><i class="fa-solid fa-comments"></i> نظرات</li>
                    <li class="menu-item" onclick="switchPanel('users', event)"><i class="fa-solid fa-users"></i> کاربران</li>
                </ul>
            </div>
            <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
        </aside>

        <main class="content-area">

            <!-- تب محصولات -->
            <div id="panel-products" class="tab-panel active">
                <div class="section-header">مدیریت محصولات</div>
                <div class="glass-card">
                    <h3 id="formTitle" style="font-size: 1rem; margin-bottom: 1.2rem; font-weight: 700;">افزودن محصول جدید</h3>
                    <form id="productForm" onsubmit="saveProduct(event)">
                        <input type="hidden" id="p_id">
                        <div class="form-grid">
                            <div class="field"><label>نام محصول</label><input type="text" id="p_name" required></div>
                            <div class="field">
                                <label>دسته‌بندی</label>
                                <select id="p_category" required>
                                    <option value="موبایل و قاب">موبایل و قاب</option>
                                    <option value="کابل و شارژر">کابل و شارژر</option>
                                    <option value="ایرپاد و هندزفری">ایرپاد و هندزفری</option>
                                    <option value="هدفون و دورگردنی">هدفون و دورگردنی</option>
                                    <option value="اسپیکر و لوازم صوتی">اسپیکر و لوازم صوتی</option>
                                    <option value="مبدل و ذخیره‌سازی">مبدل و ذخیره‌سازی</option>
                                    <option value="لوازم جانبی خودرو">لوازم جانبی خودرو</option>
                                </select>
                            </div>
                            <div class="field"><label>قیمت اصلی (تومان)</label><input type="text" id="p_price" required></div>
                            <div class="field"><label>قیمت با تخفیف</label><input type="text" id="p_discount"></div>
                            <div class="field"><label>بخش نمایش</label><select id="p_section"><option value="normal">عادی</option><option value="special">پیشنهاد ویژه</option></select></div>
                            <div class="field full"><label>لینک تصویر</label><input type="text" id="p_image" required></div>
                            <div class="field full"><label>توضیحات کوتاه</label><input type="text" id="p_desc"></div>
                        </div>
                        <div class="form-actions" style="margin-top:1rem;">
                            <button type="submit" class="btn-save" style="padding: 0.6rem 1.5rem;">ذخیره محصول</button>
                            <button type="button" class="btn-cancel" onclick="resetForm()">انصراف</button>
                        </div>
                    </form>
                </div>
                
                <div class="glass-card">
                    <div class="admin-category-filters" id="adminCatFilters">
                        <button class="cat-btn active" onclick="filterAdminProducts('all')">همه</button>
                        <button class="cat-btn" onclick="filterAdminProducts('موبایل و قاب')">قاب</button>
                        <button class="cat-btn" onclick="filterAdminProducts('کابل و شارژر')">شارژر</button>
                        <button class="cat-btn" onclick="filterAdminProducts('ایرپاد و هندزفری')">ایرپاد</button>
                        <button class="cat-btn" onclick="filterAdminProducts('هدفون و دورگردنی')">هدفون</button>
                        <button class="cat-btn" onclick="filterAdminProducts('اسپیکر و لوازم صوتی')">اسپیکر</button>
                        <button class="cat-btn" onclick="filterAdminProducts('مبدل و ذخیره‌سازی')">مبدل</button>
                        <button class="cat-btn" onclick="filterAdminProducts('لوازم جانبی خودرو')">خودرو</button>
                    </div>
                    <div class="table-wrapper">
                        <table>
                            <thead><tr><th>تصویر/نام</th><th>دسته‌بندی</th><th>قیمت</th><th>عملیات</th></tr></thead>
                            <tbody id="productsTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- تب سفارشات -->
            <div id="panel-orders" class="tab-panel">
                <div class="section-header">سفارشات</div>
                <div class="glass-card table-wrapper">
                    <table>
                        <thead><tr><th>مشتری/تلفن</th><th>آدرس و پیگیری</th><th>مبلغ</th><th>وضعیت</th></tr></thead>
                        <tbody id="ordersTable"></tbody>
                    </table>
                </div>
            </div>

            <!-- تب نظرات -->
            <div id="panel-reviews" class="tab-panel">
                <div class="section-header">مدیریت نظرات کاربران</div>
                <div class="glass-card table-wrapper">
                    <table>
                        <thead><tr><th>کاربر</th><th>متن نظر</th><th>پاسخ شما</th><th>وضعیت</th><th>عملیات</th></tr></thead>
                        <tbody id="reviewsTable"></tbody>
                    </table>
                </div>
            </div>

            <!-- تب کاربران -->
            <div id="panel-users" class="tab-panel">
                <div class="section-header">لیست کاربران</div>
                <div class="glass-card table-wrapper">
                    <table>
                        <thead><tr><th>نام</th><th>شماره / ایمیل</th><th>تاریخ عضویت</th></tr></thead>
                        <tbody id="usersTable"></tbody>
                    </table>
                </div>
            </div>
            
        </main>
    </div>

    <script>
        const API_BASE = "https://mobile-iran-api.mahdih1479mm.workers.dev";
        let allAdminProducts = [];

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

        function handleLogin(e) {
            e.preventDefault();
            if (document.getElementById('passInput').value === '@mobileIRAN') { 
                document.getElementById('login-wrapper').style.display = 'none';
                document.getElementById('dashboard-wrapper').style.display = 'flex';
                document.getElementById('mobileHeader').style.display = 'flex';
                fetchData();
            } else { alert('رمز عبور نادرست است!'); }
        }

        function logout() { location.reload(); }
        
        function switchPanel(name, event) {
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
            document.getElementById('panel-' + name).classList.add('active');
            document.getElementById('sidebar').classList.remove('open');
        }

        function fetchData() { fetchProductsAdmin(); fetchOrders(); fetchUsers(); fetchReviews(); }

        // --- محصولات و فیلترها ---
        async function fetchProductsAdmin() {
            const res = await fetch(`${API_BASE}/api/products`);
            allAdminProducts = await res.json();
            renderAdminProducts(allAdminProducts);
        }

        function renderAdminProducts(items) {
            const tbody = document.getElementById('productsTable');
            tbody.innerHTML = items.length ? '' : '<tr><td colspan="4" style="text-align:center;">خالی</td></tr>';
            items.forEach(p => {
                tbody.innerHTML += `<tr>
                    <td><div style="display:flex; align-items:center; gap:10px;"><img src="${p.image}" class="thumb"> <span>${p.name}</span></div></td>
                    <td>${p.category}</td><td>${p.price}</td>
                    <td><div class="action-btns">
                        <button class="icon-btn" style="color:var(--accent-color); border-color:var(--accent-color);" onclick="editProduct(${p.id})"><i class="fa-solid fa-pen"></i></button>
                        <button class="icon-btn" style="color:var(--danger); border-color:var(--danger);" onclick="deleteProduct(${p.id})"><i class="fa-solid fa-trash"></i></button>
                    </div></td>
                </tr>`;
            });
        }

        function filterAdminProducts(cat) {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            if(cat === 'all') renderAdminProducts(allAdminProducts);
            else renderAdminProducts(allAdminProducts.filter(p => p.category === cat));
        }

        async function saveProduct(e) {
            e.preventDefault();
            const id = document.getElementById('p_id').value;
            const data = {
                name: document.getElementById('p_name').value, category: document.getElementById('p_category').value,
                price: document.getElementById('p_price').value, discount_price: document.getElementById('p_discount').value,
                section: document.getElementById('p_section').value, image: document.getElementById('p_image').value,
                description: document.getElementById('p_desc').value
            };
            await fetch(id ? `${API_BASE}/api/products/${id}` : `${API_BASE}/api/products`, {
                method: id ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
            });
            alert('انجام شد'); resetForm(); fetchProductsAdmin();
        }

        function editProduct(id) {
            const p = allAdminProducts.find(x => x.id === id);
            if (!p) return;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            document.getElementById('p_id').value = p.id;
            ['name','category','price','discount_price','section','image','description'].forEach(k => {
                document.getElementById(`p_${k.replace('discount_price','discount').replace('description','desc')}`).value = p[k] || '';
            });
            document.getElementById('formTitle').innerText = 'ویرایش: ' + p.name;
        }

        async function deleteProduct(id) {
            if(confirm("حذف شود؟")) { await fetch(`${API_BASE}/api/products/${id}`, { method: 'DELETE' }); fetchProductsAdmin(); }
        }
        
        function resetForm() { document.getElementById('productForm').reset(); document.getElementById('p_id').value = ''; document.getElementById('formTitle').innerText = 'افزودن محصول جدید'; }

        // --- سفارشات ---
        async function fetchOrders() {
            const res = await fetch(`${API_BASE}/api/orders`);
            const orders = await res.json();
            const tbody = document.getElementById('ordersTable');
            tbody.innerHTML = orders.length ? '' : '<tr><td colspan="4" style="text-align:center;">سفارشی نیست</td></tr>';
            
            orders.forEach(order => {
                let addressInfo = '-';
                try {
                    const parsed = JSON.parse(order.items);
                    addressInfo = `آدرس: ${parsed.address}<br><span style="color:var(--danger)">پیگیری: ${parsed.trackingCode}</span>`;
                } catch(e) {}

                const selectMenu = `
                    <select class="status-select" onchange="changeOrderStatus(${order.id}, this.value)">
                        <option value="pending" ${order.status === 'pending' || !order.status ? 'selected' : ''}>بررسی</option>
                        <option value="completed" ${order.status === 'completed' ? 'selected' : ''}>تکمیل</option>
                        <option value="cancelled" ${order.status === 'cancelled' ? 'selected' : ''}>لغو</option>
                        <option value="failed" ${order.status === 'failed' ? 'selected' : ''}>واریز ناموفق</option>
                    </select>
                `;

                tbody.innerHTML += `<tr>
                    <td><b>${order.user_name}</b><br><span style="font-size:0.8rem;">${order.phone}</span></td>
                    <td style="font-size:0.8rem; line-height:1.5;">${addressInfo}</td>
                    <td><b>${order.total_amount.toLocaleString()}</b></td>
                    <td>${selectMenu}</td>
                </tr>`;
            });
        }

        async function changeOrderStatus(id, newStatus) {
            if(confirm('تغییر وضعیت ثبت شود؟')) {
                await fetch(`${API_BASE}/api/orders/${id}`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({status: newStatus}) });
            }
            fetchOrders();
        }

        // --- نظرات ---
        async function fetchReviews() {
            const res = await fetch(`${API_BASE}/api/reviews`);
            const reviews = await res.json();
            const tbody = document.getElementById('reviewsTable');
            tbody.innerHTML = reviews.length ? '' : '<tr><td colspan="5" style="text-align:center;">نظری ثبت نشده</td></tr>';
            
            reviews.forEach(r => {
                const isReplied = !!r.reply;
                const badge = isReplied ? '<span class="badge badge-completed">پاسخ داده شده</span>' : '<span class="badge badge-pending">در انتظار پاسخ</span>';
                const replyText = r.reply ? r.reply : '-';
                tbody.innerHTML += `<tr>
                    <td>${r.user_name}</td>
                    <td>${r.comment}</td>
                    <td style="color:var(--accent-color); font-size:0.85rem;">${replyText}</td>
                    <td>${badge}</td>
                    <td><button class="icon-btn reply" onclick="replyToReview(${r.id})"><i class="fa-solid fa-reply"></i> ${isReplied ? 'ویرایش پاسخ' : 'ثبت پاسخ'}</button></td>
                </tr>`;
            });
        }

        async function replyToReview(id) {
            const text = prompt("متن پاسخ خود را برای این کاربر بنویسید:");
            if(text !== null && text.trim() !== "") {
                await fetch(`${API_BASE}/api/reviews/${id}`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({reply: text}) });
                fetchReviews();
            }
        }

        // --- کاربران ---
        async function fetchUsers() {
            const res = await fetch(`${API_BASE}/api/users`);
            const users = await res.json();
            const tbody = document.getElementById('usersTable');
            tbody.innerHTML = users.length ? '' : '<tr><td colspan="3" style="text-align:center;">کاربری نیست</td></tr>';
            users.forEach(u => {
                tbody.innerHTML += `<tr><td>${u.name}</td><td>${u.phone_or_email}</td><td>${new Date(u.created_at).toLocaleDateString('fa-IR')}</td></tr>`;
            });
        }
    </script>
</body>
</html>
