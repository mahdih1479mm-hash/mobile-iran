<script>
        const API_URL = 'https://mobile-iran-api.mahdih1479mm.workers.dev';

        let products = [];
        let orders = [];
        let users = [];

        // --- سیستم لاگین ادمین ---
        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('admin-user').value;
            const password = document.getElementById('admin-pass').value;

            try {
                const response = await fetch(`${API_URL}/api/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (response.ok) {
                    document.getElementById('login-section').style.display = 'none';
                    document.getElementById('dashboard-section').style.display = 'block';
                    if (result.token) {
                        localStorage.setItem('adminToken', result.token);
                    }
                    initDashboard();
                } else {
                    alert(result.error || 'نام کاربری یا رمز عبور اشتباه است!');
                }
            } catch (error) {
                console.error('Network Error:', error);
                alert('خطا در ارتباط با سرور ابری.');
            }
        }

        function logout() {
            localStorage.removeItem('adminToken');
            document.getElementById('login-section').style.display = 'flex';
            document.getElementById('dashboard-section').style.display = 'none';
            document.getElementById('admin-pass').value = '';
        }

        // --- مدیریت تب‌ها ---
        function switchTab(tabId, btn) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            
            btn.classList.add('active');
            document.getElementById(`tab-${tabId}`).classList.add('active');
        }

        async function initDashboard() {
            await fetchProducts();
            await fetchOrders();
            await fetchUsers();
        }

        // --- دریافت و مدیریت محصولات از سرور ابری ---
        async function fetchProducts() {
            try {
                const res = await fetch(`${API_URL}/api/products`);
                products = await res.json();
                renderProducts();
            } catch (err) {
                console.error('Error fetching products:', err);
            }
        }

        function renderProducts() {
            const tbody = document.getElementById('products-table-body');
            tbody.innerHTML = '';
            
            products.forEach(p => {
                let priceHtml = p.discountPrice 
                    ? `<span class="price-strike">${p.price}</span> <br> <span style="color:var(--danger); font-weight:bold;">${p.discountPrice}</span>` 
                    : p.price;

                tbody.innerHTML += `
                    <tr>
                        <td class="product-img-td"><img src="${p.image}" alt=""></td>
                        <td style="font-weight:700;">${p.name}</td>
                        <td><span class="badge badge-info">${p.category}</span></td>
                        <td>${priceHtml}</td>
                        <td>
                            <div class="action-btns">
                                <button class="btn-icon btn-edit" onclick="editProduct(${p.id})"><i class="fa-solid fa-pen"></i></button>
                                <button class="btn-icon btn-delete" onclick="deleteProduct(${p.id})"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </td>
                    </tr>
                `;
            });
        }

        function openProductModal() {
            document.getElementById('productModal').style.display = 'flex';
            document.getElementById('modal-title').innerText = 'افزودن محصول جدید';
            document.getElementById('p_id').value = '';
            document.getElementById('p_name').value = '';
            document.getElementById('p_price').value = '';
            document.getElementById('p_discount').value = '';
            document.getElementById('p_image').value = '';
            document.getElementById('p_desc').value = '';
        }

        function closeProductModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        async function saveProduct(e) {
            e.preventDefault();
            const id = document.getElementById('p_id').value;
            const productData = {
                name: document.getElementById('p_name').value,
                category: document.getElementById('p_category').value,
                price: document.getElementById('p_price').value,
                discountPrice: document.getElementById('p_discount').value,
                image: document.getElementById('p_image').value,
                desc: document.getElementById('p_desc').value
            };

            const token = localStorage.getItem('adminToken');
            const method = id ? 'PUT' : 'POST';
            const endpoint = id ? `${API_URL}/api/products/${id}` : `${API_URL}/api/products`;

            try {
                const res = await fetch(endpoint, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(productData)
                });

                if (res.ok) {
                    await fetchProducts();
                    closeProductModal();
                } else {
                    alert('خطا در ذخیره محصول روی سرور');
                }
            } catch (err) {
                console.error('Error saving product:', err);
            }
        }

        function editProduct(id) {
            const p = products.find(p => p.id === id);
            if(p) {
                document.getElementById('p_id').value = p.id;
                document.getElementById('p_name').value = p.name;
                document.getElementById('p_category').value = p.category;
                document.getElementById('p_price').value = p.price;
                document.getElementById('p_discount').value = p.discountPrice || '';
                document.getElementById('p_image').value = p.image;
                document.getElementById('p_desc').value = p.desc || '';
                
                document.getElementById('modal-title').innerText = 'ویرایش محصول';
                document.getElementById('productModal').style.display = 'flex';
            }
        }

        async function deleteProduct(id) {
            if(confirm('آیا از حذف این محصول اطمینان دارید؟')) {
                const token = localStorage.getItem('adminToken');
                try {
                    const res = await fetch(`${API_URL}/api/products/${id}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) {
                        await fetchProducts();
                    } else {
                        alert('خطا در حذف محصول');
                    }
                } catch (err) {
                    console.error('Error deleting product:', err);
                }
            }
        }

        // --- دریافت سفارشات از سرور ---
        async function fetchOrders() {
            try {
                const token = localStorage.getItem('adminToken');
                const res = await fetch(`${API_URL}/api/admin/orders`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                orders = await res.json();
                renderOrders();
            } catch (err) {
                console.error('Error fetching orders:', err);
            }
        }

        function renderOrders() {
            const tbody = document.getElementById('orders-table-body');
            tbody.innerHTML = '';
            
            orders.forEach(o => {
                let badgeClass = o.status === 'تایید شده' ? 'badge-success' : 'badge-danger';
                tbody.innerHTML += `
                    <tr>
                        <td>${o.date}</td>
                        <td style="font-weight:700;">${o.customer}</td>
                        <td>${o.total} تومان</td>
                        <td style="font-family:monospace; font-size:1rem;">${o.tracking}</td>
                        <td><span class="badge ${badgeClass}">${o.status}</span></td>
                        <td>
                            <button class="btn-icon btn-view" onclick="alert('نمایش جزئیات سفارش برای: ${o.customer}')"><i class="fa-solid fa-eye"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        // --- دریافت کاربران از سرور ---
        async function fetchUsers() {
            try {
                const token = localStorage.getItem('adminToken');
                const res = await fetch(`${API_URL}/api/admin/users`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                users = await res.json();
                renderUsers();
            } catch (err) {
                console.error('Error fetching users:', err);
            }
        }

        function renderUsers() {
            const tbody = document.getElementById('users-table-body');
            tbody.innerHTML = '';
            
            users.forEach(u => {
                tbody.innerHTML += `
                    <tr>
                        <td style="font-weight:700;">${u.name}</td>
                        <td style="font-family:monospace; font-size:1rem;">${u.mobile}</td>
                        <td>${u.date}</td>
                        <td><span class="badge badge-success">${u.status}</span></td>
                    </tr>
                `;
            });
        }
    </script>
