<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت جامع | Mobile Iran</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
        body { background-color: #121216; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        #loginBox { background: #1e1e24; padding: 2.5rem; border-radius: 12px; width: 100%; max-width: 400px; text-align: center; border: 1px solid #333; }
        #loginBox h2 { margin-bottom: 1.5rem; color: #00ffcc; font-size: 1.4rem; }
        .login-input { width: 100%; padding: 0.8rem; margin-bottom: 1rem; border-radius: 8px; border: 1px solid #444; background: #2a2a33; color: #fff; }
        .login-btn { width: 100%; padding: 0.8rem; background: #00ffcc; color: #111; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

        #adminPanel { display: none; width: 100%; max-width: 1200px; padding: 2rem; margin: auto; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid #333; padding-bottom: 1rem; }
        
        .admin-tabs { display: flex; gap: 1rem; margin-bottom: 2rem; }
        .tab-btn { background: #2a2a33; color: #fff; border: none; padding: 0.7rem 1.5rem; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: #00ffcc; color: #111; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
        .admin-box { background: #1e1e24; padding: 1.5rem; border-radius: 12px; border: 1px solid #333; }
        .admin-box h3 { margin-bottom: 1.2rem; color: #00ffcc; font-size: 1.1rem; }
        
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.85rem; margin-bottom: 0.4rem; color: #bbb; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.7rem; border-radius: 8px; border: 1px solid #444; background: #2a2a33; color: #fff; font-size: 0.9rem; }
        
        .btn-submit { background: #00ffcc; color: #111; border: none; padding: 0.8rem; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; }
        .btn-cancel { background: #555; color: #fff; border: none; padding: 0.5rem; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 0.3rem; display: none; }

        .admin-list { max-height: 400px; overflow-y: auto; background: #2a2a33; border-radius: 8px; padding: 0.5rem; }
        .admin-item { display: flex; justify-content: space-between; align-items: center; padding: 0.8rem; border-bottom: 1px solid #3d3d4a; font-size: 0.85rem; gap: 0.5rem; }
        .btn-delete { background: #ff3b30; color: #fff; border: none; padding: 0.3rem 0.6rem; border-radius: 4px; cursor: pointer; }
        .btn-edit { background: #0071e3; color: #fff; border: none; padding: 0.3rem 0.6rem; border-radius: 4px; cursor: pointer; }
        
        .back-site { color: #888; font-size: 0.9rem; text-decoration: none; }
        .back-site:hover { color: #fff; }
    </style>
</head>
<body>

    <div id="loginBox">
        <h2>ورود به پنل ادمین</h2>
        <input type="password" id="adminPassword" class="login-input" placeholder="رمز عبور (admin123)">
        <button class="login-btn" onclick="checkPassword()">تایید و ورود</button>
        <br><br>
        <a href="index.html" class="back-site">← بازگشت به سایت</a>
    </div>

    <div id="adminPanel">
        <div class="admin-header">
            <h2>پنل مدیریت پیشرفته Mobile Iran</h2>
            <a href="index.html" class="back-site">مشاهده سایت اصلی ↗</a>
        </div>

        <div class="admin-tabs">
            <button class="tab-btn active" onclick="switchTab('products')">مدیریت محصولات</button>
            <button class="tab-btn" onclick="switchTab('users')">کاربران ثبت‌نامی</button>
            <button class="tab-btn" onclick="switchTab('comments')">مدیریت نظرات و پاسخ‌ها</button>
        </div>

        <!-- تب محصولات -->
        <div id="tab-products" class="tab-content active">
            <div class="admin-grid">
                <div class="admin-box">
                    <h3 id="formTitle">+ افزودن / ویرایش محصول</h3>
                    <form id="productForm" onsubmit="saveProduct(event)">
                        <input type="hidden" id="editIndex" value="">
                        <div class="form-group"><label>نام محصول</label><input type="text" id="pName" required></div>
                        <div class="form-group"><label>قیمت اصلی (تومان)</label><input type="text" id="pPrice" required></div>
                        <div class="form-group">
                            <label><input type="checkbox" id="hasDiscount" onchange="toggleDisc()"> فعال‌سازی تخفیف</label>
                            <input type="text" id="pDiscountPrice" placeholder="قیمت تخفیف‌خورده" style="display:none; margin-top:5px;">
                        </div>
                        <div class="form-group"><label>دسته‌بندی</label>
                            <select id="pCategory">
                                <option value="قاب‌ها (Cases)">قاب‌ها (Cases)</option>
                                <option value="مگ‌سیف (MagSafe)">مگ‌سیف (MagSafe)</option>
                                <option value="کابل و مبدل (Cables)">کابل و مبدل (Cables)</option>
                                <option value="شارژر وایرلس (Charger)">شارژر وایرلس (Charger)</option>
                                <option value="بند ساعت (Straps)">بند ساعت (Straps)</option>
                                <option value="پاوربانک (Power Banks)">پاوربانک (Power Banks)</option>
                            </select>
                        </div>
                        <div class="form-group"><label>لینک عکس (URL)</label><input type="url" id="pImage" required></div>
                        <button type="submit" class="btn-submit" id="submitBtn">ذخیره محصول</button>
                        <button type="button" class="btn-cancel" id="cancelBtn" onclick="resetForm()">لغو</button>
                    </form>
                </div>
                <div class="admin-box">
                    <h3>لیست محصولات موجود</h3>
                    <div class="admin-list" id="adminProductsList"></div>
                </div>
            </div>
        </div>

        <!-- تب کاربران -->
        <div id="tab-users" class="tab-content">
            <div class="admin-box">
                <h3>لیست کاربران ثبت‌نام شده در سایت</h3>
                <div class="admin-list" id="adminUsersList"></div>
            </div>
        </div>

        <!-- تب نظرات -->
        <div id="tab-comments" class="tab-content">
            <div class="admin-box">
                <h3>مدیریت نظرات کاربران و ارسال پاسخ</h3>
                <div class="admin-list" id="adminCommentsList"></div>
            </div>
        </div>
    </div>

    <script>

const API_BASE = "https://mobileiran.mahdih1479mm.workers.dev";

// ۱. افزودن یا ویرایش محصول در دیتابیس کلودفلر
async function saveProductToCloud(productData) {
    try {
        const res = await fetch(`${API_BASE}/api/products`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(productData)
        });
        if(res.ok) {
            alert('محصول با موفقیت در دیتابیس ذخیره شد!');
            location.reload();
        }
    } catch(err) {
        alert('خطا در ارتباط با سرور');
    }
}

// ۲. گرفتن لیست کاربران ثبت‌نامی از دیتابیس
async function loadUsersFromCloud() {
    try {
        const res = await fetch(`${API_BASE}/api/users`);
        const users = await res.json();
        const list = document.getElementById('adminUsersList');
        list.innerHTML = '';
        users.forEach(u => {
            list.innerHTML += `<div class="admin-item"><span>نام: <b>${u.name}</b> | موبایل: ${u.phone}</span></div>`;
        });
    } catch(err) {
        console.error('خطا در بارگذاری کاربران');
    }
}

// ۳. ثبت پاسخ ادمین به نظر کاربران
async function saveReplyToCloud(commentId) {
    const replyText = document.getElementById(`reply_${commentId}`).value;
    try {
        const res = await fetch(`${API_BASE}/api/comments/reply`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: commentId, reply: replyText })
        });
        if(res.ok) {
            alert('پاسخ ثبت شد!');
            location.reload();
        }
    } catch(err) {
        alert('خطا در ثبت پاسخ');
    }
}

        const SECURE_PASS = "admin123";

        function checkPassword() {
            if (document.getElementById('adminPassword').value === SECURE_PASS) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadAllData();
            } else { alert('رمز عبور اشتباه است!'); }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
        }

        function toggleDisc() {
            let isChecked = document.getElementById('hasDiscount').checked;
            document.getElementById('pDiscountPrice').style.display = isChecked ? 'block' : 'none';
        }

        let products = JSON.parse(localStorage.getItem('mobile_iran_products')) || [];

        function saveProduct(e) {
            e.preventDefault();
            const editIndex = document.getElementById('editIndex').value;
            const hasDiscount = document.getElementById('hasDiscount').checked;

            const productData = {
                id: editIndex !== "" ? products[editIndex].id : Date.now(),
                name: document.getElementById('pName').value,
                price: document.getElementById('pPrice').value,
                hasDiscount,
                discountPrice: hasDiscount ? document.getElementById('pDiscountPrice').value : '',
                category: document.getElementById('pCategory').value,
                image: document.getElementById('pImage').value
            };

            if (editIndex !== "") { products[editIndex] = productData; } 
            else { products.push(productData); }

            localStorage.setItem('mobile_iran_products', JSON.stringify(products));
            resetForm();
            renderProductsList();
            alert('ذخیره شد!');
        }

        function editProduct(index) {
            const p = products[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('pName').value = p.name;
            document.getElementById('pPrice').value = p.price;
            document.getElementById('hasDiscount').checked = p.hasDiscount || false;
            toggleDisc();
            document.getElementById('pDiscountPrice').value = p.discountPrice || '';
            document.getElementById('pCategory').value = p.category;
            document.getElementById('pImage').value = p.image;
            document.getElementById('submitBtn').innerText = 'بروزرسانی';
            document.getElementById('cancelBtn').style.display = 'block';
        }

        function resetForm() {
            document.getElementById('productForm').reset();
            document.getElementById('editIndex').value = '';
            document.getElementById('pDiscountPrice').style.display = 'none';
            document.getElementById('submitBtn').innerText = 'ذخیره محصول';
            document.getElementById('cancelBtn').style.display = 'none';
        }

        function deleteProduct(id) {
            products = products.filter(p => p.id !== id);
            localStorage.setItem('mobile_iran_products', JSON.stringify(products));
            renderProductsList();
        }

        function renderProductsList() {
            const list = document.getElementById('adminProductsList');
            list.innerHTML = products.length ? '' : '<p style="text-align:center; color:#aaa;">محصولی ثبت نشده است.</p>';
            products.forEach((p, idx) => {
                list.innerHTML += `<div class="admin-item"><span><b>${p.name}</b> (${p.price})</span><div><button class="btn-edit" onclick="editProduct(${idx})">ویرایش</button> <button class="btn-delete" onclick="deleteProduct(${p.id})">حذف</button></div></div>`;
            });
        }

        function renderUsersList() {
            let users = JSON.parse(localStorage.getItem('mobile_iran_users')) || [];
            const list = document.getElementById('adminUsersList');
            list.innerHTML = users.length ? '' : '<p style="text-align:center; color:#aaa;">کاربری ثبت‌نام نکرده است.</p>';
            users.forEach(u => {
                list.innerHTML += `<div class="admin-item"><span>نام: <b>${u.name}</b> | موبایل: ${u.phone}</span></div>`;
            });
        }

        function renderCommentsList() {
            let allComments = JSON.parse(localStorage.getItem('mobile_iran_comments')) || {};
            const list = document.getElementById('adminCommentsList');
            list.innerHTML = '';
            let hasComment = false;

            for (let prodId in allComments) {
                allComments[prodId].forEach((c, cIdx) => {
                    hasComment = true;
                    list.innerHTML += `
                        <div class="admin-item" style="flex-direction:column; align-items:flex-start; gap:5px;">
                            <div><strong>${c.author}:</strong> ${c.text}</div>
                            <div style="width:100%; display:flex; gap:5px; margin-top:5px;">
                                <input type="text" id="reply_${prodId}_${cIdx}" value="${c.reply || ''}" placeholder="پاسخ ادمین..." style="flex:1; padding:5px; background:#1e1e24; border:1px solid #444; color:#fff; border-radius:4px;">
                                <button onclick="saveReply('${prodId}', ${cIdx})" style="background:#00ffcc; color:#111; border:none; padding:5px 10px; border-radius:4px; cursor:pointer; font-weight:bold;">ثبت پاسخ</button>
                            </div>
                        </div>`;
                });
            }
            if(!hasComment) list.innerHTML = '<p style="text-align:center; color:#aaa;">نظری ثبت نشده است.</p>';
        }

        function saveReply(prodId, cIdx) {
            let allComments = JSON.parse(localStorage.getItem('mobile_iran_comments')) || {};
            let replyText = document.getElementById(`reply_${prodId}_${cIdx}`).value;
            allComments[prodId][cIdx].reply = replyText;
            localStorage.setItem('mobile_iran_comments', JSON.stringify(allComments));
            alert('پاسخ ثبت شد!');
            renderCommentsList();
        }

        function loadAllData() {
            renderProductsList();
            renderUsersList();
            renderCommentsList();
        }
    </script>
</body>
</html>
